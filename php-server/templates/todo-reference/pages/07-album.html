<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>이음 · 앨범</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/eium.css">
</head>
<body>

<!--
  화면: 앨범 / 탭: 앨범
  ※ .photo--hero / --a ~ --d 의 background gradient 는 실제 사진이 들어갈 자리의 플레이스홀더입니다.
     구현 시 <img> 로 교체하고 gradient 는 제거하세요.
-->
<main class="app app--status">
  <div class="album">

    <header class="album__head">
      <div>
        <div class="album__kicker">함께 모은 순간들</div>
        <h1 class="album__title">앨범</h1>
      </div>
      <button type="button" class="album__upload">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        사진 올리기
      </button>
    </header>

    <div class="album__body">
      <div class="album__grid">

        <!-- 대표 사진 -->
        <figure class="photo photo--hero">
          <div class="photo__scrim"></div>
          <div class="photo__flag">
            <span class="diamond diamond--sm"></span>
            <span class="photo__flag-text">이 사진으로 질문이 만들어졌어요</span>
          </div>
          <figcaption class="photo__caption">
            <div class="photo__caption-title">1982년 봄, 창경원 나들이</div>
            <div class="photo__caption-sub">아버지 앨범에서 · 지난주</div>
          </figcaption>
          <div class="photo__reacts">
            <button type="button" class="react">🥹 2</button>
            <button type="button" class="react react--mine">❤️ 5</button>
          </div>
        </figure>

        <figure class="photo photo--a"></figure>

        <figure class="photo photo--b">
          <span class="react react--corner">😊 3</span>
        </figure>

        <figure class="photo photo--c"></figure>

        <figure class="photo photo--d">
          <div class="photo__flag photo__flag--sm">
            <span class="diamond diamond--sm"></span>
            <span class="photo__flag-text">질문 생성됨</span>
          </div>
        </figure>

        <button type="button" class="album__add">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#B4A99C" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="album__add-text">추억 더하기</span>
        </button>

      </div>
    </div>

  </div>

  <!-- 하단 탭바 (앨범 활성) -->
  <nav class="tabbar">
    <a class="tabbar__item" href="05-story-child.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tabbar__label">이야기</span>
    </a>
    <a class="tabbar__item tabbar__item--on" href="07-album.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span class="tabbar__label tabbar__label--on">앨범</span>
    </a>
    <a class="tabbar__item" href="03-home-child.html">
      <span class="tabbar__home tabbar__home--off">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      </span>
      <span class="tabbar__label">홈</span>
    </a>
    <a class="tabbar__item" href="08-calendar.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      <span class="tabbar__label">캘린더</span>
    </a>
    <a class="tabbar__item" href="09-settings.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      <span class="tabbar__label">설정</span>
    </a>
  </nav>

</main>
</body>
</html>
