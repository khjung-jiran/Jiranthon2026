<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>이음 · 홈 (자녀 모드)</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/eium.css">
</head>
<body>

<!-- 화면: 홈 (자녀 모드) / 탭: 홈 -->
<main class="app app--status">
  <div class="home">

    <!-- 인사 + 알림 -->
    <header class="home__top">
      <div>
        <div class="home__date">7월 11일 금요일</div>
        <h1 class="home__greet">안녕하세요, 지훈님</h1>
        <div class="home__link">
          <span class="dot"></span>
          <span class="home__link-text">어머니 · 아버지와 연결되어 있어요</span>
        </div>
      </div>
      <button type="button" class="bell" aria-label="알림">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5C544A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg>
        <span class="bell__badge"></span>
      </button>
    </header>

    <!-- 퀵 액션 2개 -->
    <div class="quick">
      <a class="quick__btn quick__btn--primary" href="10-send-question.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        <div>
          <div class="quick__title">질문 보내기</div>
          <div class="quick__sub">궁금한 것을 물어보세요</div>
        </div>
      </a>
      <a class="quick__btn quick__btn--plain" href="12-processing.html">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#2E5B4C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18v-6a9 9 0 0 1 18 0v6"/><path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z"/></svg>
        <div>
          <div class="quick__title">도착한 답변 <span class="quick__count">1</span></div>
          <div class="quick__sub">어머니의 목소리가 왔어요</div>
        </div>
      </a>
    </div>

    <!-- 질문 카드 덱 (좌우 스와이프) -->
    <section class="deck-wrap">
      <div class="deck-head">
        <div class="deck-head__left">
          <span class="sec-title">도착한 질문</span>
          <span class="pill pill--primary">3</span>
        </div>
        <span class="deck-head__hint">← 카드를 밀어보세요</span>
      </div>

      <div class="deck">
        <!-- 뒷장 2 -->
        <div class="deck__back-2"></div>
        <!-- 뒷장 1 (다음 카드 미리보기) -->
        <div class="deck__back-1">
          <span class="pill pill--tag">수민 (동생)</span>
          <div class="deck__back-title">어머니가 제일 좋아하시는
노래가 뭔지 물어봐 줘</div>
        </div>
        <!-- 최상단 카드 -->
        <article class="deck__card">
          <div class="deck__card-top">
            <span class="deck__from">AI 이음이 제안</span>
            <span class="deck__time">오늘 오전</span>
          </div>
          <div class="deck__q">아버지의 첫 출근날,
어떤 기분이셨을지 여쭤보세요</div>
          <div class="deck__sub">일대기 '청년기' 챕터를 채울 수 있는 질문이에요</div>
          <div class="spacer"></div>
          <a class="btn btn--primary deck__cta" href="10-send-question.html">
            <span class="btn__label">이 질문 보내기</span>
          </a>
        </article>
      </div>

      <div class="deck-dots">
        <span class="deck-dots__i deck-dots__i--on"></span>
        <span class="deck-dots__i"></span>
        <span class="deck-dots__i"></span>
      </div>
    </section>

  </div>

  <!-- 하단 탭바 (홈 활성) -->
  <nav class="tabbar">
    <a class="tabbar__item" href="05-story-child.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tabbar__label">이야기</span>
    </a>
    <a class="tabbar__item" href="07-album.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span class="tabbar__label">앨범</span>
    </a>
    <a class="tabbar__item tabbar__item--on" href="03-home-child.html">
      <span class="tabbar__home">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      </span>
      <span class="tabbar__label tabbar__label--on">홈</span>
    </a>
    <a class="tabbar__item" href="08-calendar.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      <span class="tabbar__label">캘린더</span>
    </a>
    <a class="tabbar__item" href="09-settings.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      <span class="tabbar__label">설정</span>
    </a>
  </nav>

</main>
</body>
</html>
