<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>이음 · 공통 컴포넌트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/eium.css">
</head>
<body>

<!--
  화면이 아니라 "공통 컴포넌트 카탈로그"입니다.
  여러 페이지에 반복 등장하는 요소를 한 곳에 모아 두었으니, 구현 시 이 마크업을 재사용하세요.
-->
<main class="app app--status" style="padding:20px 22px;overflow-y:auto;gap:22px">

  <!-- 토스트 -->
  <div class="sec-label">토스트 · .toast</div>
  <div style="position:relative;height:56px">
    <div class="toast" style="position:static">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7FC79E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
      <span class="toast__text">어머니께 질문을 보냈어요</span>
    </div>
  </div>

  <!-- 버튼 -->
  <div class="sec-label">버튼 · .btn</div>
  <div style="display:flex;flex-direction:column;gap:10px">
    <button class="btn btn--primary"><span class="btn__label">기본 (primary)</span></button>
    <button class="btn btn--green"><span class="btn__label">완료 (green)</span></button>
    <button class="btn btn--ghost"><span class="btn__label">보조 (ghost)</span></button>
    <button class="btn btn--danger"><span class="btn__label">파괴적 (danger)</span></button>
    <button class="btn btn--primary btn--lg"><span class="btn__label">부모 모드 대형 (--lg)</span></button>
  </div>

  <!-- 배지 / 칩 -->
  <div class="sec-label">배지 · 태그 · .pill / .seg</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">
    <span class="pill pill--primary">3</span>
    <span class="pill pill--tag">수민 (동생)</span>
    <span class="pill pill--tag-warm">음성 답변</span>
    <span class="pill pill--tag-green">질문 답변</span>
    <span class="pill pill--dday">D-13</span>
    <span class="seg seg--on">단편집</span>
    <span class="seg seg--off">일대기</span>
    <span class="pill--soon">회고록 · 준비 중</span>
  </div>

  <!-- 아바타 -->
  <div class="sec-label">아바타 · .avatar</div>
  <div style="display:flex;gap:10px;align-items:center">
    <span class="avatar avatar--warm avatar--sm">순</span>
    <span class="avatar avatar--warm">지</span>
    <span class="avatar avatar--cool avatar--lg">영</span>
    <span class="avatar avatar--warm avatar--xl">지</span>
  </div>

  <!-- 입력 -->
  <div class="sec-label">입력 · .input / .check</div>
  <input class="input" type="text" placeholder="아이디">
  <label class="check">
    <span class="check__box"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span class="check__label">체크됨</span>
  </label>
  <label class="check">
    <span class="check__box check__box--off"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span>
    <span class="check__label">체크 해제</span>
  </label>

  <!-- 토글 -->
  <div class="sec-label">토글 · .switch</div>
  <div style="display:flex;gap:12px;align-items:center">
    <span class="switch"><span class="switch__knob"></span></span>
    <span class="switch switch--off"><span class="switch__knob"></span></span>
  </div>

  <!-- 진행 바 -->
  <div class="sec-label">진행 바 · .bar</div>
  <div class="bar"><div class="bar__fill" style="width:60%"></div></div>
  <div class="bar bar--lg"><div class="bar__fill bar__fill--grad" style="width:45%"></div></div>

  <!-- 안심 문구 -->
  <div class="sec-label">프라이버시 안내 · .privacy-pill</div>
  <div class="privacy-pill" style="align-self:flex-start">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#2E5B4C" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    <span class="privacy-pill__text">목소리와 기억은 기기 안에서만 처리돼요</span>
  </div>

  <div style="height:20px"></div>
</main>
