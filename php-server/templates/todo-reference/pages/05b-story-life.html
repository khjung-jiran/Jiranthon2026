<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>이음 · 이야기 — 일대기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/eium.css">
</head>
<body>

<!--
  화면: 이야기 — 일대기 탭 / 05-story-child.html 과 동일한 화면에서 세그먼트만 '일대기'로 전환된 상태
  헤더(.story__head)는 동일하고, 본문만 .story__list → .life 로 교체됩니다.
-->
<main class="app app--status">
  <div class="story">
    <div class="grain"></div>

    <header class="story__head">
      <div class="story__kicker">우리 가족의 서재</div>
      <h1 class="story__title">이야기</h1>
      <div class="story__tabs">
        <a class="seg seg--off" href="05-story-child.html">단편집</a>
        <span class="seg seg--on">일대기</span>
        <button type="button" class="pill--soon">회고록 · 준비 중</button>
      </div>
    </header>

    <section class="life">
      <div class="life__banner">
        <div class="life__banner-title">아버지의 일대기</div>
        <div class="life__banner-sub">이야기 12편 · 여섯 챕터 중 4번째를 쓰고 있어요</div>
      </div>

      <div class="chapter">
        <span class="chapter__num">一</span>
        <div class="chapter__body">
          <div class="chapter__name">유년기</div>
          <div class="chapter__sub">이야기 4편</div>
        </div>
        <div class="chapter__prog">
          <div class="bar"><div class="bar__fill" style="width:85%"></div></div>
          <div class="chapter__pct">85%</div>
        </div>
      </div>

      <div class="chapter">
        <span class="chapter__num">二</span>
        <div class="chapter__body">
          <div class="chapter__name">청소년기</div>
          <div class="chapter__sub">이야기 3편</div>
        </div>
        <div class="chapter__prog">
          <div class="bar"><div class="bar__fill" style="width:60%"></div></div>
          <div class="chapter__pct">60%</div>
        </div>
      </div>

      <div class="chapter chapter--current">
        <span class="chapter__num">三</span>
        <div class="chapter__body">
          <div class="chapter__name">청년기 <span class="chapter__badge">지금 쓰는 중</span></div>
          <div class="chapter__sub">이야기 3편 · 오늘 1편이 더해졌어요</div>
        </div>
        <div class="chapter__prog">
          <div class="bar"><div class="bar__fill bar__fill--warm" style="width:45%"></div></div>
          <div class="chapter__pct">45%</div>
        </div>
      </div>

      <div class="chapter">
        <span class="chapter__num">四</span>
        <div class="chapter__body">
          <div class="chapter__name">부모가 된 후</div>
          <div class="chapter__sub">이야기 2편</div>
        </div>
        <div class="chapter__prog">
          <div class="bar"><div class="bar__fill" style="width:30%"></div></div>
          <div class="chapter__pct">30%</div>
        </div>
      </div>

      <div class="chapter chapter--empty">
        <span class="chapter__num">五</span>
        <div class="chapter__body">
          <div class="chapter__name">퇴직</div>
          <div class="chapter__sub">아직 비어 있어요 · 천천히 채워가요</div>
        </div>
        <div class="chapter__prog">
          <div class="bar"><div class="bar__fill" style="width:0"></div></div>
          <div class="chapter__pct"></div>
        </div>
      </div>

      <div class="chapter chapter--empty">
        <span class="chapter__num">六</span>
        <div class="chapter__body">
          <div class="chapter__name">현재</div>
          <div class="chapter__sub">아직 비어 있어요</div>
        </div>
        <div class="chapter__prog">
          <div class="bar"><div class="bar__fill" style="width:0"></div></div>
          <div class="chapter__pct"></div>
        </div>
      </div>
    </section>

  </div>

  <!-- 하단 탭바 (이야기 활성) -->
  <nav class="tabbar">
    <a class="tabbar__item tabbar__item--on" href="05-story-child.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>
      <span class="tabbar__label tabbar__label--on">이야기</span>
    </a>
    <a class="tabbar__item" href="07-album.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      <span class="tabbar__label">앨범</span>
    </a>
    <a class="tabbar__item" href="03-home-child.html">
      <span class="tabbar__home tabbar__home--off">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h5v-6h4v6h5V9.5"/></svg>
      </span>
      <span class="tabbar__label">홈</span>
    </a>
    <a class="tabbar__item" href="08-calendar.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 10h18M8 2v4M16 2v4"/></svg>
      <span class="tabbar__label">캘린더</span>
    </a>
    <a class="tabbar__item" href="09-settings.html">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      <span class="tabbar__label">설정</span>
    </a>
  </nav>

</main>
</body>
</html>
