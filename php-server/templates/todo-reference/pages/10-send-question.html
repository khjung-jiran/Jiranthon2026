<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=390,initial-scale=1">
<title>이음 · 질문 보내기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../css/eium.css">
</head>
<body>

<!--
  화면: 질문 보내기 (자녀 모드 전용, 풀스크린 오버레이)
  진입점: 홈 퀵액션 '질문 보내기' / 질문 카드의 '이 질문 보내기'
-->
<main class="app send">

  <div class="page-head">
    <a class="icon-btn" href="03-home-child.html" aria-label="뒤로">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5C544A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </a>
    <span class="page-head__title">질문 보내기</span>
  </div>

  <!-- 받는 사람 -->
  <div class="send__label">받는 사람</div>
  <div class="send__chips">
    <button type="button" class="chip chip--on">
      <span class="avatar avatar--warm-2 avatar--sm">순</span>
      <span class="chip__name">어머니</span>
    </button>
    <button type="button" class="chip">
      <span class="avatar avatar--cool avatar--sm">영</span>
      <span class="chip__name">아버지</span>
    </button>
  </div>

  <!-- AI 추천 질문 -->
  <div class="send__ai">
    <span class="diamond"></span>
    <span class="send__ai-text">AI 이음이 추천해요</span>
  </div>
  <div class="send__recs">
    <button type="button" class="qopt qopt--on">
      어릴 적 살던 동네는 어떤 모습이었어요?
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E4643E" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
    </button>
    <button type="button" class="qopt">두 분은 처음에 어떻게 만나셨어요?</button>
    <button type="button" class="qopt">살면서 가장 자랑스러웠던 순간은 언제예요?</button>
  </div>

  <!-- 직접 입력 -->
  <div class="send__label">직접 물어보기</div>
  <textarea class="send__free" placeholder="궁금했던 것을 편하게 적어보세요…"></textarea>

  <div class="spacer"></div>

  <button type="button" class="btn btn--primary send__submit">
    <span class="btn__label">어머니께 질문 보내기</span>
  </button>

</main>
</body>
</html>
