<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>이음 EIUM — 화면별 HTML / CSS 뷰어</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F0EDE6; --panel:#fff; --ink:#2B2622; --muted:#8A8178; --muted-2:#B4A99C;
  --line:rgba(43,38,34,.12); --accent:#E4643E; --accent-dark:#C05430; --green:#2E5B4C;
  --code-bg:#1F1B18; --code-fg:#E8E1D6;
  --sidebar:264px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;display:flex;height:100vh;overflow:hidden;
  font-family:'Pretendard Variable',Pretendard,-apple-system,sans-serif;
  background:var(--bg);color:var(--ink);
}

/* ───────── 좌측 목차 ───────── */
.side{
  width:var(--sidebar);flex-shrink:0;height:100%;overflow-y:auto;
  background:#fff;border-right:1px solid var(--line);padding:20px 0 40px;
}
.side__brand{padding:0 18px 16px}
.side__title{font-size:15px;font-weight:800;letter-spacing:-.01em}
.side__sub{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.side__group{
  padding:16px 18px 6px;font-size:10.5px;font-weight:800;
  letter-spacing:.09em;color:var(--muted-2);text-transform:uppercase;
}
.nav__item{
  display:block;width:100%;text-align:left;border:none;background:none;cursor:pointer;
  padding:9px 18px 9px 16px;border-left:3px solid transparent;font:inherit;
}
.nav__item:hover{background:rgba(43,38,34,.04)}
.nav__item--on{background:#FBEDE6;border-left-color:var(--accent)}
.nav__num{font-size:10.5px;font-weight:700;color:var(--muted-2);letter-spacing:.04em}
.nav__item--on .nav__num{color:var(--accent-dark)}
.nav__name{font-size:13.5px;font-weight:600;margin-top:2px}
.nav__item--on .nav__name{font-weight:700;color:var(--accent-dark)}
.side__foot{margin:20px 18px 0;padding-top:16px;border-top:1px solid var(--line);font-size:11.5px;color:var(--muted);line-height:1.7}
.side__foot code{background:rgba(43,38,34,.06);padding:1px 5px;border-radius:4px;font-size:11px}

/* ───────── 본문 2분할 ───────── */
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.topbar{
  flex-shrink:0;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;
  padding:16px 22px;border-bottom:1px solid var(--line);background:#fff;
}
.topbar__title{font-size:17px;font-weight:800;letter-spacing:-.01em}
.topbar__file{font-size:12px;color:var(--accent-dark);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.topbar__desc{font-size:12.5px;color:var(--muted);flex-basis:100%}

.split{flex:1;min-height:0;display:flex}

/* 좌: 앱 디자인 */
.preview{
  width:46%;min-width:420px;flex-shrink:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  padding:24px;border-right:1px solid var(--line);overflow:auto;
}
.phone{
  width:390px;height:844px;flex-shrink:0;position:relative;
  border-radius:44px;background:#1F1B18;padding:11px;
  box-shadow:0 24px 60px rgba(43,38,34,.28);
}
.phone__screen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#FDFBF7;position:relative}
.phone__notch{
  position:absolute;top:11px;left:50%;transform:translateX(-50%);
  width:126px;height:32px;border-radius:0 0 18px 18px;background:#1F1B18;z-index:5;
}
.phone__status{
  position:absolute;top:0;left:0;right:0;height:54px;z-index:4;
  display:flex;align-items:center;justify-content:space-between;padding:16px 26px 0;
  font-size:13px;font-weight:600;color:#2B2622;pointer-events:none;
}
.phone iframe{width:390px;height:844px;border:0;display:block}
.preview__meta{font-size:11.5px;color:var(--muted)}
.preview__meta b{color:var(--ink)}

/* 우: 코드 (상하 분리) */
.code{flex:1;min-width:0;display:flex;flex-direction:column}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;border-bottom:1px solid var(--line)}
.pane:last-child{border-bottom:none}
.pane__head{
  flex-shrink:0;display:flex;align-items:center;gap:10px;
  padding:10px 16px;background:#fff;border-bottom:1px solid var(--line);
}
.pane__label{font-size:12.5px;font-weight:800}
.pane__hint{font-size:11px;color:var(--muted);flex:1}
.pane__btn{
  border:1px solid var(--line);background:#fff;border-radius:7px;
  padding:5px 11px;font:inherit;font-size:11.5px;font-weight:700;color:var(--accent-dark);cursor:pointer;
}
.pane__btn:hover{background:#FBEDE6}
.pane__body{flex:1;min-height:0;overflow:auto;background:var(--code-bg)}
pre{
  margin:0;padding:16px 18px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  font-size:12px;line-height:1.65;color:var(--code-fg);
  white-space:pre;tab-size:2;
}
/* 간단한 하이라이트 */
.t{color:#7FB2E5}          /* 태그 */
.a{color:#C3A6E8}          /* 속성 */
.v{color:#9DD6A6}          /* 값 */
.c{color:#7A6F63;font-style:italic} /* 주석 */
.s{color:#F0A868}          /* CSS 선택자 */
.p{color:#8FCBE8}          /* CSS 속성 */
.n{color:#E8D7A6}          /* CSS 값 */
.var{color:#E29C7E}        /* CSS 변수 */

/* 인라인 style 잔여 안내 */
.notes{flex-shrink:0;background:#fff;padding:10px 16px;border-top:1px solid var(--line);max-height:132px;overflow:auto}
.notes__title{font-size:11px;font-weight:800;color:var(--muted-2);letter-spacing:.05em;margin-bottom:6px}
.notes__row{font-size:11.5px;color:var(--muted);line-height:1.7;font-family:ui-monospace,Menlo,monospace}
.notes__row b{color:var(--accent-dark);font-weight:700}
.notes--empty{display:none}

@media (max-width:1280px){
  .preview{width:400px;min-width:400px;padding:16px}
  .phone{transform:scale(.82);transform-origin:top center;margin-bottom:-150px}
}
</style>
</head>
<body>

<!-- ───────── 좌측 목차 ───────── -->
<aside class="side">
  <div class="side__brand">
    <div class="side__title">이음 EIUM — 화면 명세</div>
    <div class="side__sub">화면별 단독 HTML + 통합 CSS 1개</div>
  </div>
  <nav id="nav"></nav>
  <div class="side__foot">
    파일 구조<br>
    <code>index.html</code> 이 뷰어<br>
    <code>pages/*.html</code> 화면별 단독 파일<br>
    <code>css/eium.css</code> 전체 공용 스타일 1개
  </div>
</aside>

<!-- ───────── 본문 ───────── -->
<div class="main">
  <div class="topbar">
    <span class="topbar__title" id="tTitle"></span>
    <span class="topbar__file" id="tFile"></span>
    <span class="topbar__desc" id="tDesc"></span>
  </div>

  <div class="split">
    <!-- 좌: 앱 디자인 -->
    <section class="preview">
      <div class="phone">
        <div class="phone__screen">
          <div class="phone__notch"></div>
          <div class="phone__status"><span>9:41</span><span>▮▮▮ ⌁ 100%</span></div>
          <iframe id="frame" title="화면 미리보기"></iframe>
        </div>
      </div>
      <div class="preview__meta">
        기준 해상도 <b>390 × 844</b> (iPhone 14 Pro) ·
        <a id="openNew" href="#" target="_blank" rel="noopener">이 화면만 새 탭에서 열기</a>
      </div>
    </section>

    <!-- 우: 코드 (상: HTML / 하: CSS) -->
    <section class="code">
      <div class="pane">
        <div class="pane__head">
          <span class="pane__label">HTML</span>
          <span class="pane__hint" id="hHint"></span>
          <button class="pane__btn" data-copy="html">복사</button>
        </div>
        <div class="pane__body"><pre id="htmlCode"></pre></div>
      </div>

      <div class="pane">
        <div class="pane__head">
          <span class="pane__label">CSS · 이 화면에 적용되는 style 속성</span>
          <span class="pane__hint" id="cHint"></span>
          <button class="pane__btn" data-copy="css">복사</button>
        </div>
        <div class="pane__body"><pre id="cssCode"></pre></div>
        <div class="notes" id="notes"></div>
      </div>
    </section>
  </div>
</div>

<script>
const PAGES = [{"file": "01-login.html", "title": "로그인", "group": "인증", "desc": "앱 최초 진입. 아이디/비밀번호 + 소셜 로그인", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=390,initial-scale=1\">\n<title>이음 · 로그인</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!-- 화면: 로그인 / 진입점: 앱 최초 실행 -->\n<main class=\"app login\">\n\n  <div class=\"login__brand\">\n    <h1 class=\"login__logo\">이음</h1>\n    <p class=\"login__tagline\">묻고 답하며 가족의 이야기를<br>한 권의 책으로 모아요</p>\n  </div>\n\n  <!-- 아이디 / 비밀번호 -->\n  <form class=\"login__fields\" action=\"#\" method=\"post\">\n    <input class=\"input\" type=\"text\" name=\"userId\" placeholder=\"아이디\" autocomplete=\"username\">\n    <input class=\"input\" type=\"password\" name=\"password\" placeholder=\"비밀번호\" autocomplete=\"current-password\">\n  </form>\n\n  <div class=\"login__row\">\n    <label class=\"check\">\n      <!-- 체크 해제 상태는 .check__box--off 추가 -->\n      <span class=\"check__box\">\n        <svg width=\"11\" height=\"11\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"3.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n      </span>\n      <span class=\"check__label\">자동 로그인</span>\n    </label>\n    <a class=\"login__find\" href=\"#\">아이디 · 비밀번호 찾기</a>\n  </div>\n\n  <button type=\"submit\" class=\"btn btn--primary login__submit\">\n    <span class=\"btn__label\">로그인</span>\n  </button>\n\n  <div class=\"divider-row\">\n    <span class=\"divider-row__line\"></span>\n    <span class=\"divider-row__text\">간편 로그인</span>\n    <span class=\"divider-row__line\"></span>\n  </div>\n\n  <div class=\"login__social\">\n    <button type=\"button\" class=\"btn btn--social\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 48 48\"><path fill=\"#4285F4\" d=\"M45.12 24.5c0-1.56-.14-3.06-.4-4.5H24v8.51h11.84c-.51 2.75-2.06 5.08-4.39 6.64v5.52h7.11c4.16-3.83 6.56-9.47 6.56-16.17z\"/><path fill=\"#34A853\" d=\"M24 46c5.94 0 10.92-1.97 14.56-5.33l-7.11-5.52c-1.97 1.32-4.49 2.1-7.45 2.1-5.73 0-10.58-3.87-12.31-9.07H4.34v5.7C7.96 41.07 15.4 46 24 46z\"/><path fill=\"#FBBC05\" d=\"M11.69 28.18C11.25 26.86 11 25.45 11 24s.25-2.86.69-4.18v-5.7H4.34C2.85 17.09 2 20.45 2 24s.85 6.91 2.34 9.88l7.35-5.7z\"/><path fill=\"#EA4335\" d=\"M24 10.75c3.23 0 6.13 1.11 8.41 3.29l6.31-6.31C34.91 4.18 29.93 2 24 2 15.4 2 7.96 6.93 4.34 14.12l7.35 5.7c1.73-5.2 6.58-9.07 12.31-9.07z\"/></svg>\n      <span class=\"btn__label\">구글로 계속하기</span>\n    </button>\n    <button type=\"button\" class=\"btn btn--kakao\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"#191600\"><path d=\"M12 3C6.5 3 2 6.48 2 10.77c0 2.76 1.87 5.18 4.68 6.55-.2.72-.74 2.68-.85 3.1-.13.52.19.51.4.37.17-.11 2.66-1.8 3.74-2.53.66.1 1.34.15 2.03.15 5.52 0 10-3.48 10-7.64S17.52 3 12 3z\"/></svg>\n      <span class=\"btn__label\">카카오로 계속하기</span>\n    </button>\n  </div>\n\n  <div class=\"login__foot\">\n    <span class=\"login__foot-text\">처음이신가요?</span>\n    <a class=\"login__foot-link\" href=\"02-signup.html\">회원가입</a>\n  </div>\n\n</main>\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.1 버튼 ---- */\n.btn{\n  display:flex;ali tem{\n  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;\n  padding-top:2px;cursor:pointer;background:none;border:none;\n  color:var(--c-muted-3);            /* SVG는 stroke=\"currentColor\" 로 이 색을 상속 */\n}\n.tabbar__item--on{color:var(--c-primary)}\n.tabbar__label{font-size:10.5px;font-weight:600;color:var(--c-muted-3)}\n.tabbar__label--on{color:var(--c-primary);font-weight:700}\n.tabbar--parent .tabbar__label{font-size:13px;color:var(--c-text-3)}\n.tabbar--parent .tabbar__label--on{color:var(--c-primary)}\n/* 가운데 홈 버튼 */\n.tabbar__home{\n  width:52px;height:52px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  margin-top:-16px;background:var(--c-primary);color:#fff;\n  box-shadow:0 8px 18px rgba(228,100,62,.35);\n}\n\n/* ── 홈 - 부모 모드 (home-parent) ── */\n.phome{flex:1;display:flex;flex-direction:column;min-height:0;color:var(--c-ink-parent);animation:eiumFade .25s ease}\n.phome__top{padding:12px 24px 0}\n.phome__date{font-size:15px;color:var(--c-text-3);font-weight:500}\n.phome__greet{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:4px}\n.phome__link{display:flex;align-items:center;gap:7px;margin-top:9px}\n.phome__link-text{font-size:15.5px;color:var(--c-text);font-weight:500}\n.phome__quick{display:flex;gap:12px;padding:22px 24px 0}\n.phome__quick-btn{\n  flex:1;height:122px;border-radius:var(--r-xl);\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;\n  cursor:pointer;border:none;font-size:19px;font-weight:700;\n}\n.phome__quick-btn--primary{background:var(--c-primary);color:#fff;box-shadow:var(--sh-cta-strong)}\n.phome__quick-btn--plain{background:#fff;border:2px solid var(--c-ink-parent);color:var(--c-ink-parent)}\n.phome__body{flex:1;display:flex;flex-direction:column;padding:24px 24px 0;min-height:0}\n.phome__sec{font-size:18px;font-weight:700}\n.phome__deck{position:relative;flex:1;margin-top:12px;min-height:0}\n.phome__deck-back{position:absolute;inset:0;border-radius:var(--r-2xl);background:var(--c-paper-3);transform:translateY(10px) rotate(-1.4deg) scale(.96)}\n.phome__card{\n  position:absolute;inset:0;border-radius:var(--r-2xl);background:#fff;\n  border:1.5px solid rgba(32,27,22,.12);box-shadow:var(--sh-card);\n  display:flex;flex-direction:column;padding:24px;\n}\n.phome__card-who{display:flex;align-items:center;gap:9px}\n.phome__card-who-text{font-size:15px;font-weight:600;color:var(--c-text)}\n.phome__card-q{font-size:24px;font-weight:700;line-height:1.5;margin-top:16px}\n.phome__card-sub{font-size:15px;color:var(--c-text-3);margin-top:10px;line-height:1.5}\n.phome__card-cta{height:64px;border-radius:18px;font-size:20px;gap:10px;box-shadow:0 8px 18px rgba(228,100,62,.28)}\n\n/* ── 사용된 키프레임 ── */\n@keyframes eiumFade{from{opacity:0}to{opacity:1}}", "ruleCount": 41, "sections": ["리셋 / 베이스", "공통 컴포넌트", "홈 - 부모 모드 (home-parent)"], "inline": [], "classes": ["app", "app--parent", "app--status", "avatar", "avatar--warm", "btn", "btn--primary", "btn__label", "dot", "dot--lg", "phome", "phome__body", "phome__card", "phome__card-cta", "phome__card-q", "phome__card-sub", "phome__card-who", "phome__card-who-text", "phome__date", "phome__deck", "phome__deck-back", "phome__greet", "phome__link", "phome__link-text", "phome__quick", "phome__quick-btn", "phome__quick-btn--plain", "phome__quick-btn--primary", "phome__sec", "phome__top", "spacer", "tabbar", "tabbar--parent", "tabbar__home", "tabbar__item", "tabbar__item--on", "tabbar__label", "tabbar__label--on"]}, {"file": "05-story-child.html", "title": "이야기 — 단편집", "group": "메인 탭", "desc": "가족 이야기 카드 목록 (세그먼트 탭 기본값)", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=390,initial-scale=1\">\n<title>이음 · 이야기 (자녀 모드)</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!--\n  화면: 이야기 (자녀 모드) / 탭: 이야기\n  세그먼트 탭 2종 — [단편집](기본) / [일대기]\n  아래 .story__list 가 '단편집', .life 가 '일대기' 입니다. 한 번에 하나만 노출됩니다.\n-->\n<main class=\"app app--status\">\n  <div class=\"story\">\n    <div class=\"grain\"></div>\n\n    <header class=\"story__head\">\n      <div class=\"story__kicker\">우리 가족의 서재</div>\n      <h1 class=\"story__title\">이야기</h1>\n      <div class=\"story__tabs\">\n        <button type=\"button\" class=\"seg seg--on\">단편집</button>\n        <button type=\"button\" class=\"seg seg--off\">일대기</button>\n        <button type=\"button\" class=\"pill--soon\">회고록 · 준비 중</button>\n      </div>\n    </header>\n\n    <!-- ▼ 단편집 (seg=단편집 선택 시) -->\n    <section class=\"story__list\">\n      <a class=\"scard\" href=\"11-story-detail.html\">\n        <div class=\"scard__meta-row\">\n          <span class=\"pill pill--tag-warm\">음성 답변</span>\n          <span class=\"scard__meta\">7월 8일 · 4분 분량</span>\n        </div>\n        <div class=\"scard__title\">1974년, 아버지의 첫 출근날</div>\n        <p class=\"scard__preview\">새벽 다섯 시, 어머니가 다려 주신 하얀 와이셔츠를 입고 집을 나섰다. 버스 정류장까지 걸어가는 십오 분이 그렇게 길게 느껴진 적이…</p>\n      </a>\n      <a class=\"scard\" href=\"11-story-detail.html\">\n        <div class=\"scard__meta-row\">\n          <span class=\"pill pill--tag-green\">질문 답변</span>\n          <span class=\"scard__meta\">7월 3일 · 3분 분량</span>\n        </div>\n        <div class=\"scard__title\">골목길 끝의 붕어빵 가게</div>\n        <p class=\"scard__preview\">겨울이면 학교가 끝나고 집으로 오는 길, 골목 끝에 김이 모락모락 나는 리어카가 서 있었다. 백 원에 세 개…</p>\n      </a>\n      <a class=\"scard\" href=\"11-story-detail.html\">\n        <div class=\"scard__meta-row\">\n          <span class=\"pill pill--tag-warm\">음성 답변</span>\n          <span class=\"scard__meta\">6월 29일 · 5분 분량</span>\n        </div>\n        <div class=\"scard__title\">두 사람이 처음 만난 날</div>\n        <p class=\"scard__preview\">친구 결혼식 뒤풀이 자리였다. 맞은편에 앉은 사람이 자꾸 웃음을 참지 못하길래, 무슨 일인가 했더니…</p>\n      </a>\n      <a class=\"scard\" href=\"11-story-detail.html\">\n        <div class=\"scard__meta-row\">\n          <span class=\"pill pill--tag-green\">질문 답변</span>\n          <span class=\"scard__meta\">6월 21일 · 2분 분량</span>\n        </div>\n        <div class=\"scard__title\">여름밤 평상 위의 수박</div>\n        <p class=\"scard__preview\">해가 지고 나면 마당 평상에 온 식구가 모여 앉았다. 우물에 담가 두었던 수박을 꺼내 오는 것은 늘 막내 몫이었다…</p>\n      </a>\n    </section>\n\n    <!-- ▼ '일대기' 탭 선택 시에는 위 .story__list 대신 05b-story-life.html 의 .life 영역이 들어갑니다 -->\n\n  </div>\n\n  <!-- 하단 탭바 (이야기 활성) -->\n  <nav class=\"tabbar\">\n    <a class=\"tabbar__item tabbar__item--on\" href=\"05-story-child.html\">\n      <svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>\n      <span class=\"tabbar__label tabbar__label--on\">이야기</span>\n    </a>\n    <a class=\"tabbar__item\" href=\"07-album.html\">\n      <svg width=\"21\" height=\"21\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"M21 15l-5-5L5 21\"/></svg>\n      <span class=\"tabbar__label\">앨범</span>\n    </a>\n    <a class=\"tabbar__item\" href=\"03-home-child.html\">\n      <span class=\"tabbar__home tabbar__home--off\">\n        <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 );font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent}\n.seg--on{background:var(--c-ink);color:var(--c-paper)}\n.seg--off{background:#fff;color:var(--c-text-2);border-color:var(--line-2)}\n/* ---- 3.8 하단 탭바 ---- */\n.tabbar{\n  display:flex;align-items:center;flex-shrink:0;\n  height:var(--tabbar-h);padding:0 6px 10px;\n  background:rgba(253,251,247,.94);backdrop-filter:blur(12px);\n  border-top:1px solid var(--line);\n}\n.tabbar__item{\n  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;\n  padding-top:2px;cursor:pointer;background:none;border:none;\n  color:var(--c-muted-3);            /* SVG는 stroke=\"currentColor\" 로 이 색을 상속 */\n}\n.tabbar__item--on{color:var(--c-primary)}\n.tabbar__label{font-size:10.5px;font-weight:600;color:var(--c-muted-3)}\n.tabbar__label--on{color:var(--c-primary);font-weight:700}\n/* 가운데 홈 버튼 */\n.tabbar__home{\n  width:52px;height:52px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  margin-top:-16px;background:var(--c-primary);color:#fff;\n  box-shadow:0 8px 18px rgba(228,100,62,.35);\n}\n.tabbar__home--off{background:#fff;border:1px solid var(--line);box-shadow:none;color:var(--c-muted-3)}\n/* ---- 3.9 종이 질감 오버레이 ---- */\n.grain{\n  position:absolute;inset:0;pointer-events:none;opacity:.5;\n  background-image:radial-gradient(rgba(43,38,34,.028) 1px,transparent 1px);\n  background-size:5px 5px;\n}\n\n/* ── 이야기 - 자녀 (story-child) ── */\n.story{\n  flex:1;display:flex;flex-direction:column;min-height:0;position:relative;\n  background:var(--c-paper);animation:eiumFade .25s ease;\n}\n.story__head{padding:10px 22px 0;position:relative}\n.story__kicker{font-size:12px;color:var(--c-muted-2);font-weight:500}\n.story__title{font-size:25px;font-weight:600;font-family:var(--f-serif);margin-top:3px}\n.story__tabs{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}\n.story__list{flex:1;overflow-y:auto;padding:18px 22px 20px;position:relative;display:fle " href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!--\n  화면: 이야기 (부모 모드) / 탭: 이야기\n  자녀 모드와 달리 목록이 아니라 \"내 이야기가 쌓이는 모습\"을 크게 보여줍니다.\n-->\n<main class=\"app app--status app--parent\">\n  <div class=\"pstory\">\n\n    <header class=\"pstory__head\">\n      <div class=\"pstory__kicker\">차곡차곡 쌓이는</div>\n      <h1 class=\"pstory__title\">순자님의 이야기</h1>\n    </header>\n\n    <!-- 자녀 소식 카드 -->\n    <section class=\"pstory__news\">\n      <div class=\"pstory__news-who\">\n        <span class=\"avatar avatar--warm avatar--lg\">지</span>\n        <span class=\"pstory__news-label\">지훈이의 소식</span>\n      </div>\n      <div class=\"pstory__news-title\">지훈이가 어제 어머님의<br>'붕어빵 가게' 이야기를<br>세 번 들었어요</div>\n      <div class=\"pstory__news-sub\">어머님의 목소리를 아주 좋아해요.<br>다음 이야기도 기다리고 있어요.</div>\n    </section>\n\n    <!-- 책장 + 진행률 -->\n    <section class=\"pstory__books\">\n      <h2 class=\"pstory__books-title\">내 이야기가 책이 되고 있어요</h2>\n\n      <div class=\"shelf\">\n        <div class=\"book book--short\"><span class=\"book__spine\">단편집</span></div>\n        <div class=\"book book--life\"><span class=\"book__spine\">일대기</span></div>\n        <div class=\"shelf__meta\">\n          <div class=\"shelf__count\">이야기 12편</div>\n          <div class=\"shelf__desc\">천천히, 하나씩<br>쌓여가고 있어요</div>\n        </div>\n      </div>\n\n      <div class=\"progress-block\">\n        <div class=\"progress-block__row\">\n          <span>일대기 채워짐</span>\n          <span class=\"progress-block__pct\">45%</span>\n        </div>\n        <div class=\"bar bar--lg\"><div class=\"bar__fill bar__fill--grad\" style=\"width:45%\"></div></div>\n      </div>\n    </section>\n\n  </div>\n\n  <!-- 하단 탭바 (부모 모드 · 이야기 활성) -->\n  <nav class=\"tabbar tabbar--parent\">\n    <a class=\"tabbar__item tabbar__item--on\" href=\"06-story-parent.html\">\n      <svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\ -child.html\" aria-label=\"뒤로\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5C544A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"/></svg>\n    </a>\n    <span class=\"page-head__title\">질문 보내기</span>\n  </div>\n\n  <!-- 받는 사람 -->\n  <div class=\"send__label\">받는 사람</div>\n  <div class=\"send__chips\">\n    <button type=\"button\" class=\"chip chip--on\">\n      <span class=\"avatar avatar--warm-2 avatar--sm\">순</span>\n      <span class=\"chip__name\">어머니</span>\n    </button>\n    <button type=\"button\" class=\"chip\">\n      <span class=\"avatar avatar--cool avatar--sm\">영</span>\n      <span class=\"chip__name\">아버지</span>\n    </button>\n  </div>\n\n  <!-- AI 추천 질문 -->\n  <div class=\"send__ai\">\n    <span class=\"diamond\"></span>\n    <span class=\"send__ai-text\">AI 이음이 추천해요</span>\n  </div>\n  <div class=\"send__recs\">\n    <button type=\"button\" class=\"qopt qopt--on\">\n      어릴 적 살던 동네는 어떤 모습이었어요?\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#E4643E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n    </button>\n    <button type=\"button\" class=\"qopt\">두 분은 처음에 어떻게 만나셨어요?</button>\n    <button type=\"button\" class=\"qopt\">살면서 가장 자랑스러웠던 순간은 언제예요?</button>\n  </div>\n\n  <!-- 직접 입력 -->\n  <div class=\"send__label\">직접 물어보기</div>\n  <textarea class=\"send__free\" placeholder=\"궁금했던 것을 편하게 적어보세요…\"></textarea>\n\n  <div class=\"spacer\"></div>\n\n  <button type=\"button\" class=\"btn btn--primary send__submit\">\n    <span class=\"btn__label\">어머니께 질문 보내기</span>\n  </button>\n\n</main>\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n.spacer{flex:1}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.1 버튼 ---- */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  height:54px;border-radius:var(--r-md);\n  font-size:16px;font-weight:700;\n  border:none;cursor:pointer;flex-shrink:0;\n  transition:transform .12s ease;\n}\n.btn:active{transform:scale(.97)}\n.btn--primary{background:var(--c-primary);color:#fff;box-shadow:var(--sh-cta)}\n.btn__label{font-size:inherit;font-weight:inherit;color:inherit}\n/* ---- 3.2 아이콘 버튼(뒤로가기 등) ---- */\n.icon-btn{\n  width:38px;height:38px;border-radius:50%;\n  background:#fff;border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;\n}\n/* ---- 3.4 아바타 ---- */\n.avatar{\n  display:flex;align-items:center;justify-content:center;\n  width:36px;height:36px;border-radius:50%;\n  font-family:var(--f-serif);font-size:15px;font-weight:700;color:#fff;flex-shrink:0;\n}\n.avatar--warm-2{background:linear-gradient(135deg,#E8B48A,#D98D5F)}\n.avatar--cool{background:linear-gradient(135deg,#9DB8A8,#5F8271)}\n.avatar--sm{width:32px;height:32px;font-size:14px}\n/* ---- 3.6 다이아몬드 마커 (AI 표시) ---- */\n.diamond{width:8px;height:8px;border-radius:2px;background:var(--c-green);transform:rotate(45deg);flex-shrink:0}\n/* ---- 3.10 공통 헤더 ---- */\n.page-head{display:flex;align-items:center;gap:12px;padding-top:8px}\n.page-head__title{font-size:19px;font-weight:700}\n\n/* ── 질문 보내기 (send-question) ── */\n.send{padding:var(--status-bar) 22px 0;animation:eiumRise .3s ease}\n.send__label{font-size:13px;font-weight:700;color:var(--c-muted);margin-top:26px}\n.send__chips{display:flex;gap:10px;margin-top:12px}\n.chip{\n  display:flex;align-items:center;gap:9px;padding:9px 16px 9px 10px;\n  border-radius:var(--r-pill);cursor:pointer;\n  background:#fff;border:1.5px solid rgba(43,38,34,.1);\n}\n.chip--on{background:var(--c-primary-soft);border-color:var(--c-primary)}\n.chip__name{font-size:14px;font-weight:600;color:var(--c-text)}\n.chip--on .chip__name{font-weight:700;color:var(--c-primary-dark)}\n.send__ai{display:flex;align-items:center;gap:7px;margin-top:30px}\n.send__ai-text{font-size:13px;font-weight:700;color:var(--c-green)}\n.send__recs{display:flex;flex-direction:column;gap:9px;margin-top:12px}\n.qopt{\n  padding:15px 18px;border-radius:var(--r-md);background:#fff;\n  border:1px solid rgba(43,38,34,.09);\n  font-size:14.5px;font-weight:500;line-height:1.5;color:var(--c-text);\n  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;\n}\n.qopt--on{border:1.5px solid var(--c-primary);box-shadow:0 4px 12px rgba(228,100,62,.1);font-weight:600;color:var(--c-ink)}\n.send__free{\n  margin-top:10px;min-height:74px;border-radius:var(--r-md);\n  background:#fff;border:1px solid rgba(43,38,34,.09);\n  padding:14px 16px;font-size:14.5px;color:var(--c-muted-3);line-height:1.5;\n  font-family:inherit;resize:none;width:100%;outline:none;\n}\n.send__free:focus{border-color:var(--c-primary);color:var(--c-ink)}\n.send__submit{margin-bottom:34px}\n\n/* ── 사용된 키프레임 ── */\n@keyframes eiumRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}", "ruleCount": 29, "sections": ["리셋 / 베이스", "공통 컴포넌트", "질문 보내기 (send-question)"], "inline": [], "classes": ["app", "avatar", "avatar--cool", "avatar--sm", "avatar--warm-2", "btn", "btn--primary", "btn__label", "chip", "chip--on", "chip__name", "diamond", "icon-btn", "page-head", "page-head__title", "qopt", "qopt--on", "send", "send__ai", "send__ai-text", "send__chips", "send__free", "send__label", "send__recs", "send__submit", "spacer"]}, {"file": "11-story-detail.html", "title": "이야기 상세 (1쪽)", "group": "자녀 플로우", "desc": "책 지면 뷰. 본문 서체가 Noto Serif KR 로 전환", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=390,initial-scale=1\">\n<title>이음 · 이야기 상세</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!--\n  화면: 이야기 상세 (책 지면 뷰) / 진입점: 이야기 목록의 카드\n  본문 폰트가 Noto Serif KR 로 바뀌고, 하단 [이전 장 / 1 of 2 / 다음 장] 으로 페이지를 넘깁니다.\n  아래는 1페이지 상태. 2페이지 내용은 12-story-detail-p2 주석 참고.\n-->\n<main class=\"app detail\">\n  <div class=\"grain grain--fine\"></div>\n  <div class=\"detail__rule\"></div>\n\n  <div class=\"detail__bar\">\n    <a class=\"icon-btn icon-btn--paper\" href=\"05-story-child.html\" aria-label=\"뒤로\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5C544A\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"/></svg>\n    </a>\n    <button type=\"button\" class=\"detail__booklet\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#F8F3E7\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>\n      이 이야기로 소책자 만들기\n    </button>\n  </div>\n\n  <div class=\"detail__body\">\n    <header class=\"detail__head\">\n      <div class=\"detail__kicker\">일대기 · 청년기</div>\n      <h1 class=\"detail__title\">1974년, 아버지의 첫 출근날</h1>\n      <div class=\"detail__meta\">7월 8일 음성 답변에서 · 4분 분량</div>\n    </header>\n\n    <!-- 1페이지 -->\n    <article class=\"detail__page\">\n      <p>새벽 다섯 시, 어머니가 밤새 다려 주신 하얀 와이셔츠를 입고 집을 나섰다. 버스 정류장까지 걸어가는 십오 분이 그렇게 길게 느껴진 적이 없었다.</p>\n      <p>첫 월급으로는 무얼 하겠다는 계획 같은 건 없었다. 다만 대문을 나설 때 아버지가 등 뒤에서 헛기침을 두 번 하셨는데, 그것이 그 시절의 응원이었다는 걸 한참 뒤에야 알았다.</p>\n      <p>버스에는 나처럼 새 옷을 입은 젊은이들이 몇 있었다. 서로 눈이 마주치면 괜히 창밖을 보는 척했다.</p>\n    </article>\n\n    <!-- ▼ '다음 장'을 누르면 11b-story-detail-p2.html 의 .detail__page 로 교체됩니다 -->\n\n    <nav class=\"detail__nav\">\n      <button type=\"button\" class=\"detail__nav-btn\" disabled>\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"/></svg>\n        이전 장\n      </button>\n      <span class=\"detail__nav-label\">1 / 2</span>\n      <a class=\"detail__nav-btn\" href=\"11b-story-detail-p2.html\">\n        다음 장\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M9 18l6-6-6-6\"/></svg>\n      </a>\n    </nav>\n  </div>\n\n</main>\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.2 아이콘 버튼(뒤로가기 등) ---- */\n.icon-btn{\n  width:38px;height:38px;border-radius:50%;\n  background:#fff;border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;\n}\n.icon-btn--paper{background:rgba(255,253,248,.8);border-color:rgba(43,38,34,.09)}\n/* ---- 3.9 종이 질감 오버레이 ---- */\n.grain{\n  position:absolute;inset:0;pointer-events:none;opacity:.5;\n  background-image:radial-gradient(rgba(43,38,34,.028) 1px,transparent 1px);\n  background-size:5px 5px;\n}\n.grain--fine{opacity:.6;background-image:radial-gradient(rgba(43,38,34,.03) 1px,transparent 1px);background-size:4px 4px}\n\n/* ── 이야기 상세 (story-detail) ── body>\n\n<!--\n  화면: 이야기 조각 (생성 결과) / 진입점: 12-processing.html 완료 직후\n  .player 는 재생 전 상태입니다. 재생 중에는 아이콘을 ⏸ 로 바꾸고\n  .player__wave i 에 animation:eiumWave 를 부여하세요.\n-->\n<main class=\"app piece\">\n\n  <div class=\"piece__notice\">\n    <span class=\"piece__notice-text\">\n      <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E5B4C\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n      답변이 도착해, 이야기가 남았어요\n    </span>\n  </div>\n\n  <article class=\"piece__card\">\n    <div class=\"grain grain--fine\"></div>\n\n    <span class=\"piece__tag\">일대기 · '청년기' 챕터에 담겼어요</span>\n\n    <h1 class=\"piece__title\">1974년, 아버지의<br>첫 출근날</h1>\n\n    <div class=\"piece__text\">\n      <p>새벽 다섯 시, 어머니가 밤새 다려 주신 하얀 와이셔츠를 입고 집을 나섰다. 버스 정류장까지 걸어가는 십오 분이 그렇게 길게 느껴진 적이 없었다.</p>\n      <p>첫 월급으로 무얼 하겠다는 계획 같은 건 없었다. 다만 대문을 나설 때 아버지가 등 뒤에서 헛기침을 두 번 하셨다.</p>\n    </div>\n\n    <div class=\"piece__quote\">\n      <div class=\"piece__quote-text\">\"버스 창문에 비친 내 얼굴이 꼭 어른 같아서, 괜히 한 번 웃었지.\"</div>\n      <div class=\"piece__quote-src\">답변에서 아버지가 하신 말</div>\n    </div>\n\n    <div class=\"spacer\"></div>\n\n    <!-- 음성 재생 바 -->\n    <button type=\"button\" class=\"player\">\n      <span class=\"player__btn\">\n        <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M8 5v14l11-7z\"/></svg>\n      </span>\n      <span class=\"player__label\">이 날의 목소리 듣기</span>\n      <span class=\"player__wave\">\n        <i style=\"height:6px\"></i><i style=\"height:11px\"></i><i style=\"height:16px\"></i><i style=\"height:9px\"></i>\n        <i style=\"height:14px\"></i><i style=\"height:18px\"></i><i style=\"height:8px\"></i><i style=\"height:12px\"></i>\n        <i style=\"height:17px\"></i><i style=\"height:10px\"></i><i style=\"height:15px\"></i><i style=\"height:7px\"></i>\n        <i style=\"height:13px\"></i><i style=\"height:18px\"></i><i style=\"height:9px\"></i><i style=\"height:12px\"></i>\n      </span>\n      <span class=\"player__time\">0:00</span>\n    </button>\n  </article>\n\n  <div class=\"piece__actions\">\n    <a class=\"btn btn--primary\" href=\"05-story-child.html\">\n      <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg>\n      <span class=\"btn__label\">이야기책에 저장</span>\n    </a>\n    <button type=\"button\" class=\"btn btn--ghost\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#5C544A\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8\"/><path d=\"M16 6l-4-4-4 4M12 2v13\"/></svg>\n      <span class=\"btn__label\">부모님께 공유</span>\n    </button>\n  </div>\n\n</main>\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n.spacer{flex:1}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.1 버튼 ---- */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  height:54px;border-radius:var(--r-md);\n  font-size:16px;font-weight:700;\n  border:none;cursor:pointer;flex-shrink:0;\n  transition:transform .12s ease;\n}\n.btn:active{transform:scale(.97)}\n.btn--primary{background:var(--c-primary);color:#fff;box-shadow:var(--sh-cta)}\n.btn--ghost{background:#fff;border:1.5px solid var(--line-2);color:var(--c-text)}\n.btn__label{font-size:inherit;font-weight:inherit;color:inherit}\n/* ---- 3.9 종이 질감 오버레이 ---- */\n.grain{\n  position:absolute;inset:0;pointer-events:none;opacity:.5;\n  background-image:radial-gradient(rgba(43,38,34,.028) 1px,transparent 1px);\n  background-size:5px 5px;\n}\n.grain--fine{opacity:.6;background-image:radial-gradient(rgba(43,38,34,.03) 1px,transparent 1px);background-size:4px 4px}\n\n/* ── 이야기 조각 (story-piece) ── */\n.piece{\n  position:relative;height:100%;background:var(--c-bg);\n  display:flex;flex-direction:column;padding:var(--status-bar) 20px 0;\n  overflow:hidden;animation:eiumRise .45s ease;\n}\n.piece__notice{text-align:center;padding-top:12px}\n.piece__notice-text{\n  font-size:13px;font-weight:700;color:var(--c-green);\n  display:inline-flex;align-items:center;gap:6px;\n}\n.piece__card{\n  flex:1;margin-top:16px;border-radius:var(--r-xl);background:var(--c-card);\n  border:1px solid var(--line);box-shadow:var(--sh-float);\n  padding:24px 22px;display:flex;flex-direction:column;overflow:hidden;position:relative;\n}\n.piece__tag{\n  font-size:11px;font-weight:700;color:var(--c-green);background:rgba(46,91,76,.09);\n  border-radius:var(--r-pill);padding:4px 11px;align-self:flex-start;position:relative;\n}\n.piece__title{font-family:var(--f-serif);font-size:22px;font-weight:700;line-height:1.45;margin-top:16px;position:relative}\n.piece__text{font-family:var(--f-serif);font-size:13.5px;line-height:1.95;color:var(--c-text);margin-top:14px;position:relative}\n.piece__text p+p{margin-top:10px}\n.piece__quote{\n  margin-top:14px;padding:13px 16px;border-radius:14px;\n  background:var(--c-paper);border-left:3px solid var(--c-primary);position:relative;\n}\n.piece__quote-text{font-family:var(--f-serif);font-size:14px;font-weight:600;line-height:1.7}\n.piece__quote-src{font-size:11px;color:var(--c-muted-2);margin-top:6px}\n/* 재생 바 */\n.player{\n  display:flex;align-items:center;gap:11px;padding:12px 15px;\n  border-radius:var(--r-pill);background:#fff;border:1.5px solid rgba(43,38,34,.1);\n  position:relative;cursor:pointer;\n}\n.player__btn{\n  width:34px;height:34px;border-radius:50%;background:var(--c-primary);\n  display:flex;align-items:center;justify-content:center;flex-shrink:0;\n}\n.player__label{font-size:14px;font-weight:700}\n.player__wave{flex:1;display:flex;align-items:center;gap:2.5px;height:20px;overflow:hidden}\n.player__wave i{width:3px;border-radius:2px;background:rgba(228,100,62,.45);display:inline-block}\n.player__time{font-size:12px;color:var(--c-muted-2);font-variant-numeric:tabular-nums}\n.piece__actions{display:flex;gap:10px;padding:16px 0 42px}\n.piece__actions .btn:first-child{flex:1.3}\n.piece__actions .btn:last-child{flex:1}\n\n/* ── 사용된 키프레임 ── */\n@keyframes eiumWave{from{transform:scaleY(.3)}to{transform:scaleY(1)}}\n@keyframes eiumRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}", "ruleCount": 29, "sections": ["리셋 / 베이스", "공통 컴포넌트", "이야기 조각 (story-piece)"], "inline": [], "classes": ["app", "btn", "btn--ghost", "btn--primary", "btn__label", "grain", "grain--fine", "piece", "piece__actions", "piece__card", "piece__notice", "piece__notice-text", "piece__quote", "piece__quote-src", "piece__quote-text", "piece__tag", "piece__text", "piece__title", "player", "player__btn", "player__label", "player__time", "player__wave", "spacer"]}, {"file": "14-parent-answer.html", "title": "질문에 답하기", "group": "부모 플로우", "desc": "음성 녹음 (idle / rec / done 3상태)", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=390,initial-scale=1\">\n<title>이음 · 질문에 답하기 (부모 모드)</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!--\n  화면: 질문에 답하기 (부모 모드 · 음성 녹음)\n  상태 3가지 — 마이크 버튼을 누를 때마다 idle → rec → done 으로 전환\n    idle : .mic                          / \"버튼을 눌러 말씀해 주세요\"  / 하단 버튼 없음\n    rec  : .mic + .mic-ring 2개 + .wave  / \"말씀하고 계세요 · 0:12\"     / 하단 버튼 없음\n    done : .mic.mic--done (체크 아이콘)  / \"잘 담겼어요 · 0:47\"         / 하단 [다시 녹음][보내기]\n  아래는 rec(녹음 중) 상태입니다.\n-->\n<main class=\"app answer\">\n\n  <div class=\"answer__bar\">\n    <a class=\"icon-btn icon-btn--lg\" href=\"04-home-parent.html\" aria-label=\"뒤로\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#201B16\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 18l-6-6 6-6\"/></svg>\n    </a>\n    <span class=\"page-head__title\">질문에 답하기</span>\n  </div>\n\n  <section class=\"answer__q-card\">\n    <div class=\"answer__q-label\">지훈이의 질문</div>\n    <div class=\"answer__q\">어릴 적 살던 동네는<br>어떤 모습이었어요?</div>\n    <button type=\"button\" class=\"answer__listen\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#2E5B4C\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M11 5 6 9H2v6h4l5 4V5z\"/><path d=\"M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14\"/></svg>\n      <span class=\"answer__listen-text\">질문 듣기</span>\n    </button>\n  </section>\n\n  <div class=\"answer__mic-area\">\n    <div class=\"mic-wrap\">\n      <!-- 녹음 중에만 노출되는 파동 링 2개 -->\n      <span class=\"mic-ring\"></span>\n      <span class=\"mic-ring mic-ring--delay\"></span>\n      <button type=\"button\" class=\"mic\" aria-label=\"녹음\">\n        <svg width=\"52\" height=\"52\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z\"/><path d=\"M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8\"/></svg>\n      </button>\n    </div>\n\n    <!-- 녹음 중 파형 -->\n    <div class=\"wave\">\n      <i style=\"height:10px;animation-delay:0s\"></i><i style=\"height:18px;animation-delay:.06s\"></i>\n      <i style=\"height:30px;animation-delay:.11s\"></i><i style=\"height:22px;animation-delay:.17s\"></i>\n      <i style=\"height:38px;animation-delay:.22s\"></i><i style=\"height:26px;animation-delay:.28s\"></i>\n      <i style=\"height:14px;animation-delay:.33s\"></i><i style=\"height:32px;animation-delay:.39s\"></i>\n      <i style=\"height:44px;animation-delay:.44s\"></i><i style=\"height:28px;animation-delay:.50s\"></i>\n      <i style=\"height:16px;animation-delay:.55s\"></i><i style=\"height:36px;animation-delay:.61s\"></i>\n      <i style=\"height:24px;animation-delay:.66s\"></i><i style=\"height:40px;animation-delay:.72s\"></i>\n      <i style=\"height:20px;animation-delay:.77s\"></i><i style=\"height:30px;animation-delay:.83s\"></i>\n      <i style=\"height:12px;animation-delay:.88s\"></i><i style=\"height:26px;animation-delay:.94s\"></i>\n      <i style=\"height:34px;animation-delay:.99s\"></i><i style=\"height:18px;animation-delay:1.05s\"></i>\n      <i style=\"height:28px;animation-delay:1.10s\"></i><i style=\"height:42px;animation-delay:1.16s\"></i>\n      <i style=\"height:22px;animation-delay:1.21s\"></i><i style=\"height:14px;animation-delay:1.27s\"></i>\n    </div>\n\n    <div class=\"answer__status\">\n      <span class=\"dot dot--rec\"></span>\n      말씀하고 계세요 · 0:12\n    </div>\n    <div class=\"answer__status-sub\">다 하시면 버튼을 한 번 더 눌러 주세요</div>\n  </div>\n\n  <!-- done 상태에서만 노출 -->\n  <div class=\"answer__actions\">\n    <button type=\"button\" class=\"btn btn--outline btn--lg\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4A4238\" stroke-width=\"2.1\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M23 4v6h-6\"/><path d=\"M20.49 15a9 9 0 1 1-2.12-9.36L23 10\"/></svg>\n      <span class=\"btn__label\">다시 녹음</span>\n    </button>\n    <button type=\"button\" class=\"btn btn--green btn--lg\">\n      <svg width=\"19\" height=\"19\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n      <span class=\"btn__label\">보내기</span>\n    </button>\n  </div>\n\n</main>\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.1 버튼 ---- */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  height:54px;border-radius:var(--r-md);\n  font-size:16px;font-weight:700;\n  border:none;cursor:pointer;flex-shrink:0;\n  transition:transform .12s ease;\n}\n.btn:active{transform:scale(.97)}\n.btn--green{background:var(--c-green);color:#fff;box-shadow:0 8px 18px rgba(46,91,76,.3)}\n.btn--outline{background:#fff;border:1.5px solid rgba(43,38,34,.14);color:var(--c-text)}\n/* 부모 모드 대형 버튼 */\n.btn--lg{height:62px;border-radius:18px;font-size:18px}\n.btn__label{font-size:inherit;font-weight:inherit;color:inherit}\n/* ---- 3.2 아이콘 버튼(뒤로가기 등) ---- */\n.icon-btn{\n  width:38px;height:38px;border-radius:50%;\n  background:#fff;border:1px solid var(--line);\n  display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;\n}\n.icon-btn--lg{width:44px;height:44px;border:1.5px solid var(--line-strong)}\n/* ---- 3.5 연결 상태 점 ---- */\n.dot{width:7px;height:7px;border-radius:50%;background:var(--c-green);flex-shrink:0}\n.dot--rec{width:10px;height:10px;background:var(--c-rec);animation:eiumPulse 1.2s ease-in-out infinite}\n.page-head__title{font-size:19px;font-weight:700}\n\n/* ── 부모 음성 답변 (parent-answer) ── */\n.answer{\n  position:relative;height:100%;background:var(--c-bg);color:var(--c-ink-parent);\n  display:flex;flex-direction:column;align-items:center;\n  padding:var(--status-bar) 24px 0;overflow:hidden;text-align:center;animation:eiumRise .3s ease;\n}\n.answer__bar{display:flex;align-items:center;gap:12px;width:100%;padding-top:8px;text-align:left}\n.answer__q-card{\n  width:100%;margin-top:22px;border-radius:var(--r-xl);background:#fff;\n  border:1.5px solid rgba(32,27,22,.1);padding:24px;\n}\n.answer__q-label{font-size:14px;font-weight:600;color:var(--c-text-3)}\n.answer__q{font-size:24px;font-weight:700;line-height:1.5;margin-top:10px}\n.answer__listen{\n  display:inline-flex;align-items:center;gap:9px;margin-top:16px;\n  padding:12px 20px;border-radius:var(--r-pill);\n  background:rgba(46,91,76,.08);border:1.5px solid rgba(46,91,76,.25);cursor:pointer;\n}\n.answer__listen-text{font-size:16px;font-weight:700;color:var(--c-green)}\n.answer__mic-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}\n.mic-wrap{position:relative}\n.mic{\n  width:132px;height:132px;border-radius:50%;cursor:pointer;border:none;\n  background:var(--c-primary);box-shadow:0 16px 40px rgba(228,100,62,.4);\n  display:flex;align-items:center;justify-content:center;transition:background .3s ease;\n}\n.mic-ring{\n  position:absolute;inset:-20px;border-radius:50%;\n  border:2px solid rgba(228,100,62,.3);animation:eiumRing 1.8s ease-out infinite;\n}\n.mic-ring--delay{animation-delay:.9s}\n.wave{display:flex;align-items:flex-end;gap:3.5px;height:44px;margin-top:30px}\n.wave i{\n  width:4px;border-radius:2px;background:var(--c-primary);\n  transform-origin:center bottom;animation:eiumWave .8s ease-in-out infinite alternate;\n}\n.answer__status{font-size:19px;font-weight:700;margin-top:18px;display:flex;align-items:center;gap:9px}\n.answer__status-sub{font-size:15px;color:var(--c-text-3);margin-top:8px}\n.answer__actions{display:flex;gap:12px;width:100%;padding-bottom:44px;animation:eiumRise .3s ease}\n.answer__actions .btn{flex:1}\n\n/* ── 사용된 키프레임 ── */\n@keyframes eiumPulse{0%,100%{opacity:1}50%{opacity:.25}}\n@keyframes eiumWave{from{transform:scaleY(.3)}to{transform:scaleY(1)}}\n@keyframes eiumRing{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.55);opacity:0}}\n@keyframes eiumRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}", "ruleCount": 30, "sections": ["리셋 / 베이스", "공통 컴포넌트", "부모 음성 답변 (parent-answer)"], "inline": [], "classes": ["answer", "answer__actions", "answer__bar", "answer__listen", "answer__listen-text", "answer__mic-area", "answer__q", "answer__q-card", "answer__q-label", "answer__status", "answer__status-sub", "app", "btn", "btn--green", "btn--lg", "btn--outline", "btn__label", "dot", "dot--rec", "icon-btn", "icon-btn--lg", "mic", "mic-ring", "mic-ring--delay", "mic-wrap", "page-head__title", "wave"]}, {"file": "15-delete-account.html", "title": "계정 탈퇴 확인", "group": "오버레이", "desc": "설정 위에 올라오는 바텀시트", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=390,initial-scale=1\">\n<title>이음 · 계정 탈퇴 확인</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!--\n  화면: 계정 탈퇴 확인 (바텀시트) / 진입점: 설정 > 계정 탈퇴\n  ※ 단독 화면이 아니라 이전 화면 위에 올라오는 오버레이입니다.\n     .sheet-mask 는 position:absolute 이므로, 실제 구현 시 .app 안쪽 맨 끝에 붙이세요.\n     아래는 설정 화면 위에 올라온 상태를 재현한 것입니다.\n-->\n<main class=\"app app--status\">\n\n  <!-- 배경 화면 (설정) -->\n  <div class=\"set\">\n    <header class=\"set__head\">\n      <h1 class=\"set__title\">설정</h1>\n    </header>\n    <div class=\"set__list\">\n      <div class=\"srow\">\n        <span class=\"avatar avatar--warm avatar--xl\">지</span>\n        <div class=\"srow__body\">\n          <div class=\"srow__name\">지훈</div>\n          <div class=\"srow__sub\">자녀 모드 · 어머니, 아버지와 연결됨</div>\n        </div>\n      </div>\n      <div class=\"srow\">\n        <span class=\"srow__icon srow__icon--danger\">\n          <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#C0392B\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 6h18M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2m3 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6\"/><path d=\"M10 11v6M14 11v6\"/></svg>\n        </span>\n        <div class=\"srow__body\">\n          <div class=\"srow__title srow__title--danger\">계정 탈퇴</div>\n          <div class=\"srow__sub\">모든 질문·답변과 이야기책이 삭제돼요</div>\n        </div>\n      </div>\n    </div>\n  </div>\n\n  <!-- ▼ 바텀시트 -->\n  <div class=\"sheet-mask\">\n    <div class=\"sheet\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"sheetTitle\">\n      <h2 class=\"sheet__title\" id=\"sheetTitle\">정말 탈퇴하시겠어요?</h2>\n      <p class=\"sheet__desc\">지금까지 모은 질문과 답변, 이야기책이<br>모두 삭제되고 되돌릴 수 없어요.</p>\n      <div class=\"sheet__actions\">\n        <a class=\"btn btn--outline\" href=\"09-settings.html\">\n          <span class=\"btn__label\">머무를게요</span>\n        </a>\n        <button type=\"button\" class=\"btn btn--danger\">\n          <span class=\"btn__label\">탈퇴하기</span>\n        </button>\n      </div>\n    </div>\n  </div>\n\n</main>\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n/* 상단 상태바 영역을 비워두는 화면 */\n.app--status{padding-top:var(--status-bar)}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.1 버튼 ---- */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  height:54px;border-radius:var(--r-md);\n  font-size:16px;font-weight:700;\n  border:none;cursor:pointer;flex-shrink:0;\n  transition:transform .12s ease;\n}\n.btn:active{transform:scale(.97)}\n.btn--danger{background:var(--c-danger);color:#fff}\n.btn--outline{background:#fff;border:1.5px solid rgba(43,38,34,.14);color:var(--c-text)}\n.btn__label{font-size:inherit;font-weight:inherit;color:inherit}\n/* ---- 3.4 아바타 ---- */\n.avatar{\n  display:flex;align-items:center;justify-content:center;\n  width:36px;height:36px;border-radius:50%;\n  font-family:var(--f-serif);font-size:15px;font-weight:700;color:#fff;flex-shrink:0;\n}\n.avatar--warm{background:linear-gradient(135deg,#E8B48A,#C97D50)}\n.avatar--xl{width:52px;height:52px;font-size:20px;border-radius:var(--r-md)}\n\n/* ── 설정 (settings) ── */\n.set{flex:1;display:flex;flex-direction:column;min-height:0;animation:eiumFade .25s ease}\n.set__head{padding:10px 22px 0}\n.set__title{font-size:23px;font-weight:700;margin-top:3px}\n.set__list{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 0;display:flex;flex-direction:column;gap:12px}\n.srow{\n  display:flex;align-items:center;gap:14px;padding:16px;\n  border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);flex-shrink:0;\n}\n.srow__icon{\n  width:40px;height:40px;border-radius:var(--r-sm);flex-shrink:0;\n  display:flex;align-items:center;justify-content:center;background:rgba(43,38,34,.05);\n}\n.srow__icon--danger{background:rgba(192,57,43,.08)}\n.srow__body{flex:1}\n.srow__title{font-size:14.5px;font-weight:700}\n.srow__title--danger{color:var(--c-danger)}\n.srow__sub{font-size:12px;color:var(--c-muted);margin-top:3px;line-height:1.5}\n.srow__name{font-size:16px;font-weight:700}\n\n/* ── 계정 탈퇴 시트 (delete-account) ── */\n.sheet-mask{\n  position:absolute;inset:0;z-index:70;background:rgba(24,19,15,.45);\n  display:flex;align-items:flex-end;animation:eiumFade .2s ease;\n}\n.sheet{\n  width:100%;background:var(--c-bg);border-radius:var(--r-2xl) var(--r-2xl) 0 0;\n  padding:26px 24px 40px;animation:eiumRise .28s ease;\n}\n.sheet__title{font-size:19px;font-weight:700}\n.sheet__desc{font-size:13.5px;color:var(--c-text-3);margin-top:10px;line-height:1.65}\n.sheet__actions{display:flex;gap:10px;margin-top:24px}\n.sheet__actions .btn{flex:1;height:52px;font-size:15px}\n\n/* ── 사용된 키프레임 ── */\n@keyframes eiumRise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:translateY(0)}}\n@keyframes eiumFade{from{opacity:0}to{opacity:1}}", "ruleCount": 28, "sections": ["리셋 / 베이스", "공통 컴포넌트", "설정 (settings)", "계정 탈퇴 시트 (delete-account)"], "inline": [], "classes": ["app", "app--status", "avatar", "avatar--warm", "avatar--xl", "btn", "btn--danger", "btn--outline", "btn__label", "set", "set__head", "set__list", "set__title", "sheet", "sheet-mask", "sheet__actions", "sheet__desc", "sheet__title", "srow", "srow__body", "srow__icon", "srow__icon--danger", "srow__name", "srow__sub", "srow__title", "srow__title--danger"]}, {"file": "16-components.html", "title": "공통 컴포넌트", "group": "레퍼런스", "desc": "버튼·배지·아바타·입력·토글·탭바 카탈로그", "html": "<!DOCTYPE html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=390,initial-scale=1\">\n<title>이음 · 공통 컴포넌트</title>\n<link rel=\"stylesheet\" href=\"https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"https://fonts.gstatic.com\" crossorigin>\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&display=swap\">\n<link rel=\"stylesheet\" href=\"../css/eium.css\">\n</head>\n<body>\n\n<!--\n  화면이 아니라 \"공통 컴포넌트 카탈로그\"입니다.\n  여러 페이지에 반복 등장하는 요소를 한 곳에 모아 두었으니, 구현 시 이 마크업을 재사용하세요.\n-->\n<main class=\"app app--status\" style=\"padding:20px 22px;overflow-y:auto;gap:22px\">\n\n  <!-- 토스트 -->\n  <div class=\"sec-label\">토스트 · .toast</div>\n  <div style=\"position:relative;height:56px\">\n    <div class=\"toast\" style=\"position:static\">\n      <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#7FC79E\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"/></svg>\n      <span class=\"toast__text\">어머니께 질문을 보냈어요</span>\n    </div>\n  </div>\n\n  <!-- 버튼 -->\n  <div class=\"sec-label\">버튼 · .btn</div>\n  <div style=\"display:flex;flex-direction:column;gap:10px\">\n    <button class=\"btn btn--primary\"><span class=\"btn__label\">기본 (primary)</span></button>\n    <button class=\"btn btn--green\"><span class=\"btn__label\">완료 (green)</span></button>\n    <button class=\"btn btn--ghost\"><span class=\"btn__label\">보조 (ghost)</span></button>\n    <button class=\"btn btn--danger\"><span class=\"btn__label\">파괴적 (danger)</span></button>\n    <button class=\"btn btn--primary btn--lg\"><span class=\"btn__label\">부모 모드 대형 (--lg)</span></button>\n  </div>\n\n  <!-- 배지 / 칩 -->\n  <div class=\"sec-label\">배지 · 태그 · .pill / .seg</div>\n  <div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\">\n    <span class=\"pill pill--primary\">3</span>\n    <span class=\"pill pill--tag\">수민 (동생)</span>\n    <span class=\"pill pill--tag-warm\">음성 답변</span>\n    <span class=\"pill pill--tag-green\">질문 답변</span>\n    <span class=\"pill pill--dday\">D-13</span>\n    <span class=\"seg seg--on\">단편집</span>\n    <span class=\"seg seg--off\">일대기</span>\n    <span class=\"pill--soon\">회고록 · 준비 중</span>\n  </div>\n\n  <!-- 아바타 -->\n  <div class=\"sec-label\">아바타 · .avatar</div>\n  <div style=\"display:flex;gap:10px;align-items:center\">\n    <span class=\"avatar avatar--warm avatar--sm\">순</span>\n    <span class=\"avatar avatar--warm\">지</span>\n    <span class=\"avatar avatar--cool avatar--lg\">영</span>\n    <span class=\"avatar avatar--warm avatar--xl\">지</span>\n  </div>\n\n  <!-- 입력 -->\n  <div class=\"sec-label\">입 ke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/></svg><span class=\"tabbar__label\">이야기</span></a>\n  <a class=\"tabbar__item\" href=\"#\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"3\" width=\"18\" height=\"18\" rx=\"2\"/><circle cx=\"8.5\" cy=\"8.5\" r=\"1.5\"/><path d=\"M21 15l-5-5L5 21\"/></svg><span class=\"tabbar__label\">앨범</span></a>\n  <a class=\"tabbar__item tabbar__item--on\" href=\"#\"><span class=\"tabbar__home\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 10.5 12 3l9 7.5\"/><path d=\"M5 9.5V21h5v-6h4v6h5V9.5\"/></svg></span><span class=\"tabbar__label tabbar__label--on\">홈</span></a>\n  <a class=\"tabbar__item\" href=\"#\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3\" y=\"4\" width=\"18\" height=\"17\" rx=\"2\"/><path d=\"M3 10h18M8 2v4M16 2v4\"/></svg><span class=\"tabbar__label\">캘린더</span></a>\n  <a class=\"tabbar__item\" href=\"#\"><svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6\"/></svg><span class=\"tabbar__label\">설정</span></a>\n</nav>\n\n</body>\n</html>\n", "css": "/* 아래 규칙은 모두 css/eium.css 안에 있습니다. 이 화면에 해당하는 부분만 뽑은 것입니다. */\n/* 색상·반경·그림자 등 var(--*) 값은 eium.css 최상단 :root 토큰에 정의되어 있습니다. */\n\n/* ── 리셋 / 베이스 ── */\n/* 앱 화면 루트 — 390×844 기준으로 설계됨 */\n.app{\n  position:relative;\n  display:flex;\n  flex-direction:column;\n  width:100%;\n  height:100%;\n  overflow:hidden;\n  background:var(--c-bg);\n}\n/* 상단 상태바 영역을 비워두는 화면 */\n.app--status{padding-top:var(--status-bar)}\n\n/* ── 공통 컴포넌트 ── */\n/* ---- 3.1 버튼 ---- */\n.btn{\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  height:54px;border-radius:var(--r-md);\n  font-size:16px;font-weight:700;\n  border:none;cursor:pointer;flex-shrink:0;\n  transition:transform .12s ease;\n}\n.btn:active{transform:scale(.97)}\n.btn--primary{background:var(--c-primary);color:#fff;box-shadow:var(--sh-cta)}\n.btn--green{background:var(--c-green);color:#fff;box-shadow:0 8px 18px rgba(46,91,76,.3)}\n.btn--danger{background:var(--c-danger);color:#fff}\n.btn--ghost{background:#fff;border:1.5px solid var(--line-2);color:var(--c-text)}\n/* 부모 모드 대형 버튼 */\n.btn--lg{height:62px;border-radius:18px;font-size:18px}\n.btn__label{font-size:inherit;font-weight:inherit;color:inherit}\n/* ---- 3.3 칩 / 배지 / 태그 ---- */\n.pill{\n  display:inline-flex;align-items:center;gap:6px;\n  border-radius:var(--r-pill);padding:4px 10px;\n  font-size:11px;font-weight:700;\n}\n.pill--primary{background:var(--c-primary);color:#fff;padding:2px 7px}\n.pill--tag{background:rgba(43,38,34,.06);color:var(--c-muted-2);padding:4px 10px}\n.pill--tag-warm{background:rgba(228,100,62,.1);color:var(--c-primary-dark);font-size:10.5px;padding:3px 9px}\n.pill--tag-green{background:rgba(46,91,76,.09);color:var(--c-green);font-size:10.5px;padding:3px 9px}\n.pill--dday{background:rgba(228,100,62,.1);color:var(--c-primary-dark);padding:4px 10px}\n.pill--soon{\n  padding:8px 13px;border:1px dashed rgba(43,38,34,.2);\n  color:var(--c-muted-3);font-size:12px;font-weight:500;cursor:pointer;background:none;\n}\n/* 세그먼트 탭 (단편집 / 일대기) */\n.seg{padding:8px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent}\n.seg--on{background:var(--c-ink);color:var(--c-paper)}\n.seg--off{background:#fff;color:var(--c-text-2);border-color:var(--line-2)}\n/* ---- 3.4 아바타 ---- */\n.avatar{\n  display:flex;align-items:center;justify-content:center;\n  width:36px;height:36px;border-radius:50%;\n  font-family:var(--f-serif);font-size:15px;font-weight:700;color:#fff;flex-shrink:0;\n}\n.avatar--warm{background:linear-gradient(135deg,#E8B48A,#C97D50)}\n.avatar--cool{background:linear-gradient(135deg,#9DB8A8,#5F8271)}\n.avatar--sm{width:32px;height:32px;font-size:14px}\n.avatar--lg{width:42px;height:42px;font-size:17px}\n.avatar--xl{width:52px;height:52px;font-size:20px;border-radius:var(--r-md)}\n/* ---- 3.7 토스트 ---- */\n.toast{\n  position:absolute;top:66px;left:24px;right:24px;z-index:60;\n  display:flex;align-items:center;gap:9px;\n  padding:13px 17px;border-radius:var(--r-md);\n  background:rgba(32,27,22,.92);backdrop-filter:blur(10px);\n  box-shadow:0 10px 26px rgba(0,0,0,.25);\n  animation:eiumRise .3s ease;\n}\n.toast__text{font-size:13.5px;font-weight:600;color:#fff}\n/* ---- 3.8 하단 탭바 ---- */\n.tabbar{\n  display:flex;align-items:center;flex-shrink:0;\n  height:var(--tabbar-h);padding:0 6px 10px;\n  background:rgba(253,251,247,.94);backdrop-filter:blur(12px);\n  border-top:1px solid var(--line);\n}\n.tabbar--parent{height:88px;padding-bottom:14px}\n.tabbar__item{\n  flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;\n  padding-top:2px;cursor:pointer;background:none;border:none;\n  color:var(--c-muted-3);            /* SVG는 stroke=\"currentColor\" 로 이 색을 상속 */\n}\n.tabbar__item--on{color:var(--c-primary)}\n.tabbar__label{font-size:10.5px;font-weight:600;color:var(--c-muted-3)}\n.tabbar__label--on{color:var(--c-primary);font-weight:700}\n.tabbar--parent .tabbar__label{font-size:13px;color:var(--c-text-3)}\n.tabbar--parent .tabbar__label--on{color:var(--c-primary)}\n/* 가운데 홈 버튼 */\n.tabbar__home{\n  width:52px;height:52px;border-radius:50%;\n  display:flex;align-items:center;justify-content:center;\n  margin-top:-16px;background:var(--c-primary);color:#fff;\n  box-shadow:0 8px 18px rgba(228,100,62,.35);\n}\n.sec-label{font-size: const CSS_ALL = "@charset \"UTF-8\";\n/* ============================================================\n   이음 (EIUM) — 통합 스타일시트\n   원본: EIUM_프로토타입_단일파일.html 의 인라인 style 전체를 추출/정규화\n   모든 페이지(pages/*.html)가 이 파일 하나만 참조합니다.\n   ------------------------------------------------------------\n   [목차]\n   00. 디자인 토큰 (:root)\n   01. 리셋 / 베이스\n   02. 애니메이션 키프레임\n   03. 공통 컴포넌트 (버튼 / 카드 / 칩 / 아바타 / 아이콘버튼 / 토스트 / 탭바)\n   10. 로그인            (page: login)\n   11. 회원가입          (page: signup)\n   12. 홈 - 자녀 모드    (page: home-child)\n   13. 홈 - 부모 모드    (page: home-parent)\n   14. 이야기 - 자녀     (page: story-child)\n   15. 이야기 - 부모     (page: story-parent)\n   16. 앨범              (page: album)\n   17. 캘린더            (page: calendar)\n   18. 설정              (page: settings)\n   19. 질문 보내기       (page: send-question)\n   20. 이야기 상세       (page: story-detail)\n   21. 처리 중           (page: processing)\n   22. 이야기 조각       (page: story-piece)\n   23. 부모 음성 답변    (page: parent-answer)\n   24. 계정 탈퇴 시트    (page: delete-account)\n   ============================================================ */\n\n\n/* ==================== 00. 디자인 토큰 ==================== */\n:root{\n  /* Brand */\n  --c-primary:#E4643E;          /* 메인 주황 (CTA) */\n  --c-primary-dark:#C05430;     /* 진한 주황 (텍스트/링크) */\n  --c-primary-deep:#9C3F20;     /* 가장 진한 주황 (그라데이션 끝) */\n  --c-primary-soft:#FBEDE6;     /* 주황 배경 틴트 */\n  --c-green:#2E5B4C;            /* 서브 그린 (안심/보안/완료) */\n  --c-green-dark:#234639;\n  --c-danger:#C0392B;           /* 파괴적 액션 */\n  --c-rec:#E33B2E;              /* 녹음 중 인디케이터 */\n  --c-kakao:#FEE500;\n\n  /* Ink / Text */\n  --c-ink:#2B2622;              /* 기본 텍스트 (자녀 모드) */\n  --c-ink-parent:#201B16;       /* 기본 텍스트 (부모 모드, 더 진함) */\n  --c-text:#4A4238;\n  --c-text-2:#5C544A;\n  --c-text-3:#6B6156;\n  --c-muted:#8A8178;\n  --c-muted-2:#9A8F7E;\n  --c-muted-3:#B4A99C;\n  --c-muted-4:#D9CDBC;\n\n  /* Surface */\n  --c-bg:#FDFBF7;               /* 앱 기본 배경 */\n  --c-bg-outer:#F0EDE6;         /* 뷰어/문서 배경 */\n );color:#fff;padding:2px 7px}\n.pill--tag{background:rgba(43,38,34,.06);color:var(--c-muted-2);padding:4px 10px}\n.pill--tag-warm{background:rgba(228,100,62,.1);color:var(--c-primary-dark);font-size:10.5px;padding:3px 9px}\n.pill--tag-green{background:rgba(46,91,76,.09);color:var(--c-green);font-size:10.5px;padding:3px 9px}\n.pill--dday{background:rgba(228,100,62,.1);color:var(--c-primary-dark);padding:4px 10px}\n.pill--soon{\n  padding:8px 13px;border:1px dashed rgba(43,38,34,.2);\n  color:var(--c-muted-3);font-size:12px;font-weight:500;cursor:pointer;background:none;\n}\n\n/* 세그먼트 탭 (단편집 / 일대기) */\n.seg{padding:8px 14px;border-radius:var(--r-pill);font-size:12.5px;font-weight:700;cursor:pointer;border:1px solid transparent}\n.seg--on{background:var(--c-ink);color:var(--c-paper)}\n.seg--off{background:#fff;color:var(--c-text-2);border-color:var(--line-2)}\n\n/* ---- 3.4 아바타 ---- */\n.avatar{\n  display:flex;align-items:center;justify-content:center;\n  width:36px;height:36px;border-radius:50%;\n  font-family:var(--f-serif);font-size:15px;font-weight:700;color:#fff;flex-shrink:0;\n}\n.avatar--warm{background:linear-gradient(135deg,#E8B48A,#C97D50)}\n.avatar--warm-2{background:linear-gradient(135deg,#E8B48A,#D98D5F)}\n.avatar--cool{background:linear-gradient(135deg,#9DB8A8,#5F8271)}\n.avatar--sm{width:32px;height:32px;font-size:14px}\n.avatar--lg{width:42px;height:42px;font-size:17px}\n.avatar--xl{width:52px;height:52px;font-size:20px;border-radius:var(--r-md)}\n\n/* ---- 3.5 연결 상태 점 ---- */\n.dot{width:7px;height:7px;border-radius:50%;background:var(--c-green);flex-shrink:0}\n.dot--lg{width:8px;height:8px}\n.dot--rec{width:10px;height:10px;background:var(--c-rec);animation:eiumPulse 1.2s ease-in-out infinite}\n\n/* ---- 3.6 다이아몬드 마커 (AI 표시) ---- */\n.diamond{width:8px;height:8px;border-radius:2px;background:var(--c-green);transform:rotate(45deg);flex-shrink:0}\n.diamond--sm{width:7px;height:7px}\n\n/* ---- 3.7 토스트 ---- */\n.toast{\n  position:absolute;top:66px;left:
