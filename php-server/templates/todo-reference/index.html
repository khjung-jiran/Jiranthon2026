nt .page-head__title{font-size:21px}\n.sec-title{font-size:14.5px;font-weight:700}\n.sec-label{font-size:13px;font-weight:700;color:var(--c-muted)}\n\n/* ---- 3.11 진행 바 ---- */\n.bar{height:5px;border-radius:var(--r-pill);background:rgba(43,38,34,.08)}\n.bar--lg{height:10px}\n.bar__fill{height:100%;border-radius:var(--r-pill);background:var(--c-green)}\n.bar__fill--warm{background:var(--c-primary)}\n.bar__fill--grad{background:linear-gradient(90deg,#E4643E,#C05430)}\n\n\n/* ==================== 10. 로그인 (login) ==================== */\n.login{padding:var(--status-bar) 28px 0;overflow-y:auto;animation:eiumFade .3s ease}\n.login__brand{padding-top:54px}\n.login__logo{font-family:var(--f-serif);font-size:38px;font-weight:600;letter-spacing:.08em;color:var(--c-ink)}\n.login__tagline{font-size:14px;color:var(--c-muted);margin-top:12px;line-height:1.65}\n.login__fields{display:flex;flex-direction:column;gap:10px;margin-top:38px}\n.input{\n  height:54px;border-radius:var(--r-md);border:1px solid var(--line-2);\n  background:#fff;padding:0 17px;font-size:15px;font-family:inherit;\n  color:var(--c-ink);outline:none;width:100%;\n}\n.input::placeholder{color:var(--c-muted-3)}\n.input:focus{border-color:var(--c-primary)}\n.login__row{display:flex;align-items:center;justify-content:space-between;margin-top:14px}\n.check{display:flex;align-items:center;gap:8px;cursor:pointer}\n.check__box{\n  width:18px;height:18px;border-radius:6px;\n  display:flex;align-items:center;justify-content:center;flex-shrink:0;\n  background:var(--c-primary);border:1.5px solid var(--c-primary);\n}\n.check__box--off{background:#fff;border-color:var(--line-2)}\n.check__box--off svg{display:none}\n.check__label{font-size:12.5px;color:var(--c-text-2);font-weight:500}\n.login__find{font-size:12.5px;color:var(--c-muted);cursor:pointer}\n.login__submit{margin-top:20px}\n.divider-row{display:flex;align-items:center;gap:12px;margin-top:26px}\n.divider-row__line{flex:1;height:1px;background:rgba(43,38,34,.1)}\n.divider-row__text{font-size:11.5px;color:var(--c-muted-3);font-weight:500}\n.login__social{display:flex;flex-direction:column;gap:10px;margin-top:18px}\n.login__foot{display:flex;align-items:center;justify-content:center;gap:6px;margin:26px 0 40px}\n.login__foot-text{font-size:12.5px;color:var(--c-muted)}\n.login__foot-link{font-size:12.5px;font-weight:700;color:var(--c-primary-dark);cursor:pointer;border-bottom:1px solid rgba(192,84,48,.4)}\n\n\n/* ==================== 11. 회원가입 (signup) ==================== */\n.signup{padding:var(--status-bar) 28px 0;overflow-y:auto;animation:eiumFade .3s ease}\n.signup__head{padding-top:8px}\n.signup__title{font-size:26px;font-weight:700;margin-top:16px;letter-spacing:-.01em}\n.signup__desc{font-size:13.5px;color:var(--c-muted);margin-top:8px;line-height:1.65}\n.field{display:flex;flex-direction:column;gap:8px;margin-top:16px}\n.field__label{font-size:12.5px;font-weight:700;color:var(--c-text-2)}\n.field__help{font-size:11.5px;color:var(--c-muted-3);line-height:1.5}\n/* 역할 선택 (자녀 / 부모) */\n.role-pick{display:flex;gap:10px;margin-top:12px}\n.role{\n  flex:1;display:flex;flex-direction:column;align-items:center;gap:8px;\n  padding:18px 10px;border-radius:var(--r-lg);cursor:pointer;\n  background:#fff;border:1.5px solid var(--line-2);\n}\n.role--on{background:var(--c-primary-soft);border-color:var(--c-primary)}\n.role__name{font-size:14.5px;font-weight:700}\n.role__sub{font-size:11.5px;color:var(--c-muted);text-align:center;line-height:1.5}\n.agree{display:flex;flex-direction:column;gap:12px;margin-top:22px}\n.agree__row{display:flex;align-items:center;gap:9px;cursor:pointer}\n.agree__text{font-size:12.5px;color:var(--c-text-2)}\n.agree__text b{font-weight:700;color:var(--c-primary-dark)}\n.signup__submit{margin:24px 0 40px}\n\n\n/* ==================== 12. 홈 - 자녀 모드 (home-child) ==================== */\n.home{flex:1;display:flex;flex-direction:column;min-height:0;animation:eiumFade .25s ease}\n.home__top{display:flex;align-items:flex-start;justify-content:space-between;padding:10px 22px 0}\n.home__date{font-size:12px;color:var(--c-muted);font-weight:500}\n.home__greet{font-size:23px;font-weight:700;letter-spacing:-.01em;margin-top:3px}\n.home__link{display:flex;align-items:center;gap:6px;margin-top:8px}\n.home__link-text{font-size:12.5px;color:var(--c-text-2);font-weight:500}\n/* 알림 벨 */\n.bell{position:relative;width:42px;height:42px;border-radius:50%;background:#fff;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}\n.bell__badge{position:absolute;top:9px;right:10px;width:7px;height:7px;border-radius:50%;background:var(--c-primary);border:1.5px solid #fff}\n/* 퀵 액션 2개 */\n.quick{display:flex;gap:12px;padding:18px 22px 0}\n.quick__btn{\n  flex:1;height:102px;border-radius:22px;\n  display:flex;flex-direction:column;justify-content:center;gap:7px;\n  padding:0 18px;cursor:pointer;border:none;text-align:left;\n}\n.quick__btn--primary{background:var(--c-primary);box-shadow:var(--sh-cta-strong);color:#fff}\n.quick__btn--plain{background:#fff;border:1.5px solid rgba(43,38,34,.09);color:var(--c-ink)}\n.quick__title{font-size:15.5px;font-weight:700}\n.quick__sub{font-size:11.5px;margin-top:2px;color:var(--c-muted)}\n.quick__btn--primary .quick__sub{color:rgba(255,255,255,.82)}\n.quick__count{color:var(--c-primary)}\n/* 질문 카드 덱 */\n.deck-wrap{flex:1;display:flex;flex-direction:column;padding:22px 22px 0;min-height:0}\n.deck-head{display:flex;align-items:center;justify-content:space-between}\n.deck-head__left{display:flex;align-items:center;gap:7px}\n.deck-head__hint{font-size:11.5px;color:var(--c-muted-3);font-weight:500}\n.deck{position:relative;flex:1;margin-top:14px;min-height:0}\n.deck__back-2{position:absolute;inset:0;border-radius:var(--r-xl);background:var(--c-paper-4);transform:translateY(16px) rotate(2.2deg) scale(.93)}\n.deck__back-1{\n  position:absolute;inset:0;border-radius:var(--r-xl);\n  background:var(--c-paper-3);border:1px solid rgba(43,38,34,.05);\n  transform:translateY(8px) rotate(-1.6deg) scale(.965);\n  display:flex;flex-direction:column;padding:20px;overflow:hidden;\n}\n.deck__back-title{font-size:17px;font-weight:700;line-height:1.5;margin-top:12px;color:var(--c-muted-2);white-space:pre-line}\n.deck__card{\n  position:absolute;inset:0;border-radius:var(--r-xl);background:#fff;\n  border:1px solid var(--line);box-shadow:var(--sh-card);\n  display:flex;flex-direction:column;padding:20px;\n  cursor:grab;touch-action:pan-y;user-select:none;\n  transition:transform .3s cubic-bezier(.2,.8,.3,1.1);\n}\n.deck__card-top{display:flex;align-items:center;justify-content:space-between}\n.deck__from{font-size:11px;font-weight:700;color:var(--c-green);background:rgba(46,91,76,.09);border-radius:var(--r-pill);padding:4px 10px}\n/* 상태: AI 제안이 아니라 가족이 보낸 질문일 때 */\n.deck__from--person{color:var(--c-muted-2);background:rgba(43,38,34,.06)}\n.deck__time{font-size:11px;color:var(--c-muted-3)}\n.deck__q{font-size:19px;font-weight:700;line-height:1.5;letter-spacing:-.01em;margin-top:14px;white-space:pre-line}\n.deck__sub{font-size:12.5px;color:var(--c-muted);margin-top:8px}\n.deck__cta{height:50px;border-radius:15px;font-size:15px}\n.deck-dots{display:flex;align-items:center;justify-content:center;gap:5px;padding:12px 0 8px}\n.deck-dots__i{width:5px;height:5px;border-radius:50%;background:var(--c-muted-4)}\n.deck-dots__i--on{width:16px;height:5px;border-radius:var(--r-pill);background:var(--c-primary)}\n\n\n/* ==================== 13. 홈 - 부모 모드 (home-parent) ==================== */\n.phome{flex:1;display:flex;flex-direction:column;min-height:0;color:var(--c-ink-parent);animation:eiumFade .25s ease}\n.phome__top{padding:12px 24px 0}\n.phome__date{font-size:15px;color:var(--c-text-3);font-weight:500}\n.phome__greet{font-size:30px;font-weight:700;letter-spacing:-.01em;margin-top:4px}\n.phome__link{display:flex;align-items:center;gap:7px;margin-top:9px}\n.phome__link-text{font-size:15.5px;color:var(--c-text);font-weight:500}\n.phome__quick{display:flex;gap:12px;padding:22px 24px 0}\n.phome__quick-btn{\n  flex:1;height:122px;border-radius:var(--r-xl);\n  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;\n  cursor:pointer;border:none;font-size:19px;font-weight:700;\n}\n.phome__quick-btn--primary{background:var(--c-primary);color:#fff;box-shadow:var(--sh-cta-strong)}\n.phome__quick-btn--plain{background:#fff;border:2px solid var(--c-ink-parent);color:var(--c-ink-parent)}\n.phome__body{flex:1;display:flex;flex-direction:column;padding:24px 24px 0;min-height:0}\n.phome__sec{font-size:18px;font-weight:700}\n.phome__deck{position:relative;flex:1;margin-top:12px;min-height:0}\n.phome__deck-back{position:absolute;inset:0;border-radius:var(--r-2xl);background:var(--c-paper-3);transform:translateY(10px) rotate(-1.4deg) scale(.96)}\n.phome__card{\n  position:absolute;inset:0;border-radius:var(--r-2xl);background:#fff;\n  border:1.5px solid rgba(32,27,22,.12);box-shadow:var(--sh-card);\n  display:flex;flex-direction:column;padding:24px;\n}\n.phome__card-who{display:flex;align-items:center;gap:9px}\n.phome__card-who-text{font-size:15px;font-weight:600;color:var(--c-text)}\n.phome__card-q{font-size:24px;font-weight:700;line-height:1.5;margin-top:16px}\n.phome__card-sub{font-size:15px;color:var(--c-text-3);margin-top:10px;line-height:1.5}\n.phome__card-cta{height:64px;border-radius:18px;font-size:20px;gap:10px;box-shadow:0 8px 18px rgba(228,100,62,.28)}\n\n\n/* ==================== 14. 이야기 - 자녀 (story-child) ==================== */\n.story{\n  flex:1;display:flex;flex-direction:column;min-height:0;position:relative;\n  background:var(--c-paper);animation:eiumFade .25s ease;\n}\n.story__head{padding:10px 22px 0;position:relative}\n.story__kicker{font-size:12px;color:var(--c-muted-2);font-weight:500}\n.story__title{font-size:25px;font-weight:600;font-family:var(--f-serif);margin-top:3px}\n.story__tabs{display:flex;gap:8px;margin-top:16px;align-items:center;flex-wrap:wrap}\n.story__list{flex:1;overflow-y:auto;padding:18px 22px 20px;position:relative;display:flex;flex-direction:column;gap:12px}\n/* 단편 카드 */\n.scard{\n  border-radius:var(--r-lg);background:var(--c-card);\n  border:1px solid rgba(43,38,34,.07);box-shadow:0 2px 8px rgba(43,38,34,.05);\n  padding:18px 20px;cursor:pointer;flex-shrink:0;\n}\n.scard:active{transform:scale(.98)}\n.scard__meta-row{display:flex;align-items:center;gap:6px}\n.scard__meta{font-size:11.5px;color:var(--c-muted-3)}\n.scard__title{font-family:var(--f-serif);font-size:17.5px;font-weight:600;line-height:1.5;margin-top:10px}\n.scard__preview{\n  font-family:var(--f-serif);font-size:13px;color:var(--c-muted);\n  line-height:1.7;margin-top:6px;overflow:hidden;\n  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;\n}\n/* 일대기 */\n.life{flex:1;overflow-y:auto;padding:16px 22px 20px;position:relative;display:flex;flex-direction:column;gap:9px}\n.life__banner{\n  border-radius:var(--r-lg);background:linear-gradient(135deg,#2E5B4C,#234639);\n  padding:18px 20px;position:relative;overflow:hidden;flex-shrink:0;\n}\n.life__banner::after{content:\"\";position:absolute;right:-12px;top:-14px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.06)}\n.life__banner-title{font-family:var(--f-serif);font-size:18px;font-weight:600;color:var(--c-paper);position:relative}\n.life__banner-sub{font-size:12px;color:rgba(248,243,231,.75);margin-top:5px;position:relative}\n/* 챕터 행 */\n.chapter{\n  border-radius:var(--r-md);background:var(--c-card);border:1px solid rgba(43,38,34,.07);\n  padding:14px 18px;display:flex;align-items:center;gap:14px;flex-shrink:0;\n}\n.chapter--current{border:1.5px solid var(--c-primary);box-shadow:0 4px 14px rgba(228,100,62,.12)}\n.chapter--empty{opacity:.65}\n.chapter__num{font-family:var(--f-serif);font-size:13px;font-weight:700;color:var(--c-muted-2);width:20px}\n.chapter--current .chapter__num{color:var(--c-primary-dark)}\n.chapter__body{flex:1}\n.chapter__name{font-size:15px;font-weight:700}\n.chapter__badge{font-size:10.5px;font-weight:700;color:var(--c-primary-dark);background:rgba(228,100,62,.1);border-radius:var(--r-pill);padding:2px 8px;margin-left:4px}\n.chapter__sub{font-size:11.5px;color:var(--c-muted);margin-top:3px}\n.chapter__prog{width:64px}\n.chapter__pct{font-size:10px;color:var(--c-muted);margin-top:4px;text-align:right}\n.chapter--current .chapter__pct{color:var(--c-primary-dark);font-weight:700}\n\n\n/* ==================== 15. 이야기 - 부모 (story-parent) ==================== */\n.pstory{\n  flex:1;display:flex;flex-direction:column;min-height:0;position:relative;\n  background:var(--c-paper);color:var(--c-ink-parent);animation:eiumFade .25s ease;\n}\n.pstory__head{padding:12px 24px 0;position:relative}\n.pstory__kicker{font-size:15px;color:var(--c-text-3);font-weight:500}\n.pstory__title{font-size:29px;font-weight:600;font-family:var(--f-serif);margin-top:4px}\n.pstory__news{\n  margin:20px 24px 0;border-radius:var(--r-xl);background:#fff;\n  border:1.5px solid rgba(228,100,62,.35);box-shadow:0 10px 26px rgba(228,100,62,.1);\n  padding:22px;position:relative;\n}\n.pstory__news-who{display:flex;align-items:center;gap:10px}\n.pstory__news-label{font-size:14.5px;font-weight:700;color:var(--c-primary-dark)}\n.pstory__news-title{font-size:21px;font-weight:700;line-height:1.55;margin-top:14px}\n.pstory__news-sub{font-size:15px;color:var(--c-text-3);margin-top:10px;line-height:1.55}\n.pstory__books{flex:1;margin:18px 24px 0;position:relative;min-height:0}\n.pstory__books-title{font-size:17px;font-weight:700}\n.shelf{display:flex;align-items:flex-end;gap:10px;margin-top:16px}\n.book{\n  display:flex;align-items:center;justify-content:center;\n  border-radius:6px 12px 12px 6px;flex-shrink:0;\n}\n.book__spine{font-family:var(--f-serif);font-size:11px;writing-mode:vertical-rl;letter-spacing:.2em}\n.book--short{width:64px;height:88px;background:linear-gradient(105deg,#2E5B4C,#234639);box-shadow:inset 3px 0 0 rgba(255,255,255,.18),0 6px 14px rgba(43,38,34,.18)}\n.book--short .book__spine{color:var(--c-paper)}\n.book--life{width:72px;height:104px;background:linear-gradient(105deg,#C05430,#9C3F20);box-shadow:inset 3px 0 0 rgba(255,255,255,.2),0 6px 14px rgba(43,38,34,.2)}\n.book--life .book__spine{color:#FDF6EA}\n.shelf__meta{flex:1;padding-left:8px}\n.shelf__count{font-family:var(--f-serif);font-size:19px;font-weight:700}\n.shelf__desc{font-size:14px;color:var(--c-text-3);margin-top:5px;line-height:1.5}\n.progress-block{margin-top:18px}\n.progress-block__row{display:flex;justify-content:space-between;font-size:14px;font-weight:600;color:var(--c-text)}\n.progress-block__pct{color:var(--c-primary-dark);font-weight:700}\n.progress-block .bar{margin-top:8px}\n\n\n/* ==================== 16. 앨범 (album) ==================== */\n.album{flex:1;display:flex;flex-direction:column;min-height:0;animation:eiumFade .25s ease}\n.album__head{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 22px 0}\n.album__kicker{font-size:12px;color:var(--c-muted);font-weight:500}\n.album__title{font-size:23px;font-weight:700;margin-top:3px}\n.album__upload{\n  display:flex;align-items:center;gap:7px;padding:10px 16px;border-radius:var(--r-pill);\n  background:var(--c-primary);color:#fff;font-size:13px;font-weight:700;\n  box-shadow:0 6px 14px rgba(228,100,62,.25);cursor:pointer;border:none;\n}\n.album__body{flex:1;overflow-y:auto;padding:18px 22px 20px}\n.album__grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}\n.photo{position:relative;height:150px;border-radius:18px;overflow:hidden}\n.photo--hero{grid-column:1/3;height:200px;border-radius:var(--r-lg);background:linear-gradient(160deg,#E8C9A0,#C98F5F 55%,#9A6B45)}\n.photo--a{background:linear-gradient(150deg,#B9CDC0,#7E9C8C)}\n.photo--b{background:linear-gradient(150deg,#E3B7A6,#BE8271)}\n.photo--c{background:linear-gradient(150deg,#D6CBB8,#A99C82)}\n.photo--d{background:linear-gradient(150deg,#C9B8D6,#94829F)}\n.photo__scrim{position:absolute;left:0;right:0;bottom:0;height:70%;background:linear-gradient(transparent,rgba(30,20,12,.55))}\n.photo__flag{\n  position:absolute;left:14px;top:14px;display:flex;align-items:center;gap:6px;\n  padding:7px 12px;border-radius:var(--r-pill);background:rgba(253,251,247,.95);\n  box-shadow:0 3px 8px rgba(0,0,0,.12);\n}\n.photo__flag--sm{left:9px;top:9px;padding:5px 9px;box-shadow:none}\n.photo__flag-text{font-size:11px;font-weight:700;color:var(--c-green)}\n.photo__flag--sm .photo__flag-text{font-size:10px}\n.photo__caption{position:absolute;left:14px;bottom:12px;color:#fff}\n.photo__caption-title{font-size:13.5px;font-weight:700}\n.photo__caption-sub{font-size:11px;opacity:.85;margin-top:2px}\n.photo__reacts{position:absolute;right:12px;bottom:12px;display:flex;gap:5px}\n.react{\n  padding:5px 10px;border-radius:var(--r-pill);background:rgba(253,251,247,.92);\n  border:1.5px solid transparent;font-size:11.5px;font-weight:600;cursor:pointer;\n}\n.react--mine{background:var(--c-primary-soft);border-color:var(--c-primary)}\n.react--corner{position:absolute;right:9px;bottom:9px;padding:4px 9px;font-size:11px}\n.album__add{\n  grid-column:1/3;height:88px;border-radius:18px;\n  border:1.5px dashed rgba(43,38,34,.18);background:rgba(255,255,255,.5);\n  display:flex;align-items:center;justify-content:center;gap:8px;\n  color:var(--c-muted-2);cursor:pointer;\n}\n.album__add-text{font-size:12.5px;font-weight:600}\n\n\n/* ==================== 17. 캘린더 (calendar) ==================== */\n.cal{flex:1;display:flex;flex-direction:column;min-height:0;animation:eiumFade .25s ease}\n.cal__head{display:flex;align-items:flex-end;justify-content:space-between;padding:10px 22px 0}\n.cal__kicker{font-size:12px;color:var(--c-muted);font-weight:500}\n.cal__title{font-size:23px;font-weight:700;margin-top:3px}\n.cal__grid-wrap{padding:18px 22px 0}\n.cal__grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}\n.cal__dow{text-align:center;font-size:11.5px;font-weight:700;color:var(--c-muted);padding-bottom:8px}\n.cal__dow--sun{color:var(--c-primary-dark)}\n.cal__day{\n  height:38px;display:flex;align-items:center;justify-content:center;\n  font-size:14px;color:var(--c-text);border-radius:var(--r-sm);\n  position:relative;font-weight:500;\n}\n.cal__day--sun{color:var(--c-primary-dark)}\n.cal__day--today{background:var(--c-primary);color:#fff;font-weight:700;box-shadow:0 4px 10px rgba(228,100,62,.3)}\n.cal__day-dot{\n  position:absolute;bottom:3px;left:50%;transform:translateX(-50%);\n  width:4.5px;height:4.5px;border-radius:50%;background:var(--c-primary-dark);\n}\n.cal__day-dot--green{background:var(--c-green)}\n.cal__events{flex:1;padding:20px 22px 0;overflow-y:auto}\n.cal__events-head{display:flex;align-items:center;justify-content:space-between}\n.cal__add{\n  display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:var(--r-pill);\n  background:#fff;border:1px solid rgba(43,38,34,.1);\n  font-size:12.5px;font-weight:700;color:var(--c-primary-dark);cursor:pointer;\n}\n.cal__list{display:flex;flex-direction:column;gap:9px;margin-top:12px;padding-bottom:16px}\n.event{\n  display:flex;align-items:center;gap:14px;padding:14px 16px;\n  border-radius:var(--r-md);background:#fff;border:1px solid rgba(43,38,34,.07);\n}\n.event__date{\n  width:46px;height:46px;border-radius:14px;flex-shrink:0;\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  background:rgba(46,91,76,.08);\n}\n.event__date--warm{background:var(--c-primary-soft)}\n.event__mo{font-size:10px;font-weight:700;color:var(--c-green)}\n.event__day{font-size:16px;font-weight:800;color:var(--c-green);line-height:1}\n.event__date--warm .event__mo,.event__date--warm .event__day{color:var(--c-primary-dark)}\n.event__body{flex:1}\n.event__title{font-size:14.5px;font-weight:700}\n.event__sub{font-size:12px;color:var(--c-muted);margin-top:3px}\n\n\n/* ==================== 18. 설정 (settings) ==================== */\n.set{flex:1;display:flex;flex-direction:column;min-height:0;animation:eiumFade .25s ease}\n.set__head{padding:10px 22px 0}\n.set__title{font-size:23px;font-weight:700;margin-top:3px}\n.set__list{flex:1;min-height:0;overflow-y:auto;padding:18px 22px 0;display:flex;flex-direction:column;gap:12px}\n.srow{\n  display:flex;align-items:center;gap:14px;padding:16px;\n  border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);flex-shrink:0;\n}\n.srow--link{cursor:pointer}\n.srow--link:active{transform:scale(.98)}\n.srow__icon{\n  width:40px;height:40px;border-radius:var(--r-sm);flex-shrink:0;\n  display:flex;align-items:center;justify-content:center;background:rgba(43,38,34,.05);\n}\n.srow__icon--warm{background:var(--c-primary-soft)}\n.srow__icon--green{background:rgba(46,91,76,.08)}\n.srow__icon--danger{background:rgba(192,57,43,.08)}\n.srow__body{flex:1}\n.srow__title{font-size:14.5px;font-weight:700}\n.srow__title--danger{color:var(--c-danger)}\n.srow__sub{font-size:12px;color:var(--c-muted);margin-top:3px;line-height:1.5}\n.srow__name{font-size:16px;font-weight:700}\n/* 토글 */\n.switch{width:44px;height:26px;border-radius:var(--r-pill);background:var(--c-green);position:relative;flex-shrink:0}\n.switch__knob{position:absolute;top:3px;right:3px;width:20px;height:20px;border-radius:50%;background:#fff}\n.switch--off{background:rgba(43,38,34,.18)}\n.switch--off .switch__knob{right:auto;left:3px}\n/* 그룹 카드 */\n.sgroup{display:flex;flex-direction:column;border-radius:var(--r-lg);background:#fff;border:1px solid var(--line);overflow:hidden;flex-shrink:0}\n.sgroup .srow{border:none;border-radius:0;background:none}\n.sgroup__divider{height:1px;background:rgba(43,38,34,.07);margin:0 16px}\n\n\n/* ==================== 19. 질문 보내기 (send-question) ==================== */\n.send{padding:var(--status-bar) 22px 0;animation:eiumRise .3s ease}\n.send__label{font-size:13px;font-weight:700;color:var(--c-muted);margin-top:26px}\n.send__chips{display:flex;gap:10px;margin-top:12px}\n.chip{\n  display:flex;align-items:center;gap:9px;padding:9px 16px 9px 10px;\n  border-radius:var(--r-pill);cursor:pointer;\n  background:#fff;border:1.5px solid rgba(43,38,34,.1);\n}\n.chip--on{background:var(--c-primary-soft);border-color:var(--c-primary)}\n.chip__name{font-size:14px;font-weight:600;color:var(--c-text)}\n.chip--on .chip__name{font-weight:700;color:var(--c-primary-dark)}\n.send__ai{display:flex;align-items:center;gap:7px;margin-top:30px}\n.send__ai-text{font-size:13px;font-weight:700;color:var(--c-green)}\n.send__recs{display:flex;flex-direction:column;gap:9px;margin-top:12px}\n.qopt{\n  padding:15px 18px;border-radius:var(--r-md);background:#fff;\n  border:1px solid rgba(43,38,34,.09);\n  font-size:14.5px;font-weight:500;line-height:1.5;color:var(--c-text);\n  display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;\n}\n.qopt--on{border:1.5px solid var(--c-primary);box-shadow:0 4px 12px rgba(228,100,62,.1);font-weight:600;color:var(--c-ink)}\n.send__free{\n  margin-top:10px;min-height:74px;border-radius:var(--r-md);\n  background:#fff;border:1px solid rgba(43,38,34,.09);\n  padding:14px 16px;font-size:14.5px;color:var(--c-muted-3);line-height:1.5;\n  font-family:inherit;resize:none;width:100%;outline:none;\n}\n.send__free:focus{border-color:var(--c-primary);color:var(--c-ink)}\n.send__submit{margin-bottom:34px}\n\n\n/* ==================== 20. 이야기 상세 (story-detail) ==================== */\n.detail{\n  position:relative;height:100%;background:var(--c-paper-2);\n  font-family:var(--f-serif);color:#3A332B;\n  display:flex;flex-direction:column;padding:var(--status-bar) 30px 0;\n  overflow:hidden;animation:eiumRise .3s ease;\n}\n.detail__rule{position:absolute;top:var(--status-bar);bottom:0;left:12px;width:1px;background:rgba(192,84,48,.18)}\n.detail__bar{\n  display:flex;align-items:center;justify-content:space-between;\n  padding-top:8px;position:relative;font-family:var(--f-sans);\n}\n.detail__booklet{\n  display:flex;align-items:center;gap:7px;padding:9px 15px;border-radius:var(--r-pill);\n  background:var(--c-ink);color:var(--c-paper);font-size:12.5px;font-weight:700;cursor:pointer;border:none;\n}\n.detail__body{position:relative;flex:1;display:flex;flex-direction:column;min-height:0}\n.detail__head{position:relative;margin-top:24px}\n.detail__kicker{font-family:var(--f-sans);font-size:11px;font-weight:700;letter-spacing:.14em;color:var(--c-primary-dark)}\n.detail__title{font-size:23px;font-weight:700;line-height:1.45;margin-top:9px;letter-spacing:-.01em}\n.detail__meta{font-family:var(--f-sans);font-size:11.5px;color:var(--c-muted-2);margin-top:9px}\n.detail__page{position:relative;flex:1;margin-top:20px;font-size:15px;line-height:2;overflow:hidden;animation:eiumFade .3s ease;display:flex;flex-direction:column}\n.detail__page p+p{margin-top:14px}\n.detail__quote{\n  margin:6px 0 0;padding:0 0 0 16px;border-left:2.5px solid var(--c-primary);\n  font-size:15.5px;font-weight:600;line-height:1.9;color:var(--c-ink);\n}\n.detail__qr-row{display:flex;align-items:center;gap:14px;padding:16px 0 6px;border-top:1px solid rgba(43,38,34,.1)}\n.detail__qr{flex-shrink:0;background:#fff;border-radius:8px;padding:5px;border:1px solid rgba(43,38,34,.1)}\n.detail__qr-text{font-family:var(--f-sans)}\n.detail__qr-title{font-size:13px;font-weight:700;color:var(--c-ink)}\n.detail__qr-sub{font-size:11.5px;color:var(--c-muted-2);margin-top:4px;line-height:1.5}\n.detail__nav{\n  position:relative;display:flex;align-items:center;justify-content:space-between;\n  padding:10px 0 20px;font-family:var(--f-sans);\n}\n.detail__nav-btn{\n  display:flex;align-items:center;gap:5px;padding:9px 14px;border-radius:var(--r-pill);\n  font-size:12.5px;font-weight:700;cursor:pointer;\n  background:#fff;border:1px solid var(--line);color:var(--c-text-2);\n}\n.detail__nav-btn[disabled]{opacity:.35;cursor:default}\n.detail__nav-label{font-size:12px;color:var(--c-muted-2)}\n\n\n/* ==================== 21. 처리 중 (processing) ==================== */\n.proc{\n  position:relative;height:100%;background:var(--c-bg);\n  display:flex;flex-direction:column;align-items:center;justify-content:center;\n  padding:0 40px;overflow:hidden;text-align:center;animation:eiumFade .4s ease;\n}\n.proc__orb{position:relative;width:120px;height:120px;display:flex;align-items:center;justify-content:center}\n.proc__orb-glow{\n  position:absolute;inset:0;border-radius:50%;\n  background:radial-gradient(circle,rgba(228,100,62,.14),transparent 70%);\n  animation:eiumPulse 2.4s ease-in-out infinite;\n}\n.proc__title{font-family:var(--f-serif);font-size:21px;font-weight:600;line-height:1.6;margin-top:28px}\n.proc__dots{display:flex;gap:6px;margin-top:22px}\n.proc__dot{width:7px;height:7px;border-radius:50%;background:var(--c-primary);animation:eiumDot 1.3s ease-in-out infinite}\n.proc__dot:nth-child(2){animation-delay:.18s}\n.proc__dot:nth-child(3){animation-delay:.36s}\n.proc__line{margin-top:26px;height:22px;overflow:hidden;font-family:var(--f-serif);font-size:14px;color:var(--c-muted-2)}\n.privacy-pill{\n  display:flex;align-items:center;gap:7px;padding:9px 16px;\n  border-radius:var(--r-pill);background:rgba(46,91,76,.07);\n}\n.privacy-pill__text{font-size:12px;font-weight:600;color:var(--c-green)}\n.proc__privacy{position:absolute;bottom:64px}\n\n\n/* ==================== 22. 이야기 조각 (story-piece) ==================== */\n.piece{\n  position:relative;height:100%;background:var(--c-bg);\n  display:flex;flex-direction:column;padding:var(--status-bar) 20px 0;\n  overflow:hidden;animation:eiumRise .45s ease;\n}\n.piece__notice{text-align:center;padding-top:12px}\n.piece__notice-text{\n  font-size:13px;font-weight:700;color:var(--c-green);\n  display:inline-flex;align-items:center;gap:6px;\n}\n.piece__card{\n  flex:1;margin-top:16px;border-radius:var(--r-xl);background:var(--c-card);\n  border:1px solid var(--line);box-shadow:var(--sh-float);\n  padding:24px 22px;display:flex;flex-direction:column;overflow:hidden;position:relative;\n}\n.piece__tag{\n  font-size:11px;font-weight:700;color:var(--c-green);background:rgba(46,91,76,.09);\n  border-radius:var(--r-pill);padding:4px 11px;align-self:flex-start;position:relative;\n}\n.piece__title{font-family:var(--f-serif);font-size:22px;font-weight:700;line-height:1.45;margin-top:16px;position:relative}\n.piece__text{font-family:var(--f-serif);font-size:13.5px;line-height:1.95;color:var(--c-text);margin-top:14px;position:relative}\n.piece__text p+p{margin-top:10px}\n.piece__quote{\n  margin-top:14px;padding:13px 16px;border-radius:14px;\n  background:var(--c-paper);border-left:3px solid var(--c-primary);position:relative;\n}\n.piece__quote-text{font-family:var(--f-serif);font-size:14px;font-weight:600;line-height:1.7}\n.piece__quote-src{font-size:11px;color:var(--c-muted-2);margin-top:6px}\n/* 재생 바 */\n.player{\n  display:flex;align-items:center;gap:11px;padding:12px 15px;\n  border-radius:var(--r-pill);background:#fff;border:1.5px solid rgba(43,38,34,.1);\n  position:relative;cursor:pointer;\n}\n.player__btn{\n  width:34px;height:34px;border-radius:50%;background:var(--c-primary);\n  display:flex;align-items:center;justify-content:center;flex-shrink:0;\n}\n.player__label{font-size:14px;font-weight:700}\n.player__wave{flex:1;display:flex;align-items:center;gap:2.5px;height:20px;overflow:hidden}\n.player__wave i{width:3px;border-radius:2px;background:rgba(228,100,62,.45);display:inline-block}\n.player__time{font-size:12px;color:var(--c-muted-2);font-variant-numeric:tabular-nums}\n.piece__actions{display:flex;gap:10px;padding:16px 0 42px}\n.piece__actions .btn:first-child{flex:1.3}\n.piece__actions .btn:last-child{flex:1}\n\n\n/* ==================== 23. 부모 음성 답변 (parent-answer) ==================== */\n.answer{\n  position:relative;height:100%;background:var(--c-bg);color:var(--c-ink-parent);\n  display:flex;flex-direction:column;align-items:center;\n  padding:var(--status-bar) 24px 0;overflow:hidden;text-align:center;animation:eiumRise .3s ease;\n}\n.answer__bar{display:flex;align-items:center;gap:12px;width:100%;padding-top:8px;text-align:left}\n.answer__q-card{\n  width:100%;margin-top:22px;border-radius:var(--r-xl);background:#fff;\n  border:1.5px solid rgba(32,27,22,.1);padding:24px;\n}\n.answer__q-label{font-size:14px;font-weight:600;color:var(--c-text-3)}\n.answer__q{font-size:24px;font-weight:700;line-height:1.5;margin-top:10px}\n.answer__listen{\n  display:inline-flex;align-items:center;gap:9px;margin-top:16px;\n  padding:12px 20px;border-radius:var(--r-pill);\n  background:rgba(46,91,76,.08);border:1.5px solid rgba(46,91,76,.25);cursor:pointer;\n}\n.answer__listen-text{font-size:16px;font-weight:700;color:var(--c-green)}\n.answer__mic-area{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center}\n.mic-wrap{position:relative}\n.mic{\n  width:132px;height:132px;border-radius:50%;cursor:pointer;border:none;\n  background:var(--c-primary);box-shadow:0 16px 40px rgba(228,100,62,.4);\n  display:flex;align-items:center;justify-content:center;transition:background .3s ease;\n}\n/* 상태: 녹음 완료 */\n.mic--done{background:var(--c-green);box-shadow:0 16px 40px rgba(46,91,76,.35)}\n.mic-ring{\n  position:absolute;inset:-20px;border-radius:50%;\n  border:2px solid rgba(228,100,62,.3);animation:eiumRing 1.8s ease-out infinite;\n}\n.mic-ring--delay{animation-delay:.9s}\n.wave{display:flex;align-items:flex-end;gap:3.5px;height:44px;margin-top:30px}\n.wave i{\n  width:4px;border-radius:2px;background:var(--c-primary);\n  transform-origin:center bottom;animation:eiumWave .8s ease-in-out infinite alternate;\n}\n.answer__status{font-size:19px;font-weight:700;margin-top:18px;display:flex;align-items:center;gap:9px}\n.answer__status-sub{font-size:15px;color:var(--c-text-3);margin-top:8px}\n.answer__actions{display:flex;gap:12px;width:100%;padding-bottom:44px;animation:eiumRise .3s ease}\n.answer__actions .btn{flex:1}\n\n\n/* ==================== 24. 계정 탈퇴 시트 (delete-account) ==================== */\n.sheet-mask{\n  position:absolute;inset:0;z-index:70;background:rgba(24,19,15,.45);\n  display:flex;align-items:flex-end;animation:eiumFade .2s ease;\n}\n.sheet{\n  width:100%;background:var(--c-bg);border-radius:var(--r-2xl) var(--r-2xl) 0 0;\n  padding:26px 24px 40px;animation:eiumRise .28s ease;\n}\n.sheet__title{font-size:19px;font-weight:700}\n.sheet__desc{font-size:13.5px;color:var(--c-text-3);margin-top:10px;line-height:1.65}\n.sheet__actions{display:flex;gap:10px;margin-top:24px}\n.sheet__actions .btn{flex:1;height:52px;font-size:15px}\n";

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

/* --- 아주 가벼운 하이라이터 --- */
function hlHtml(src){
  let out = esc(src);
  out = out.replace(/&lt;!--[\s\S]*?--&gt;/g, m => '<span class="c">'+m+'</span>');
  out = out.replace(/(&lt;\/?)([\w-]+)/g, '$1<span class="t">$2</span>');
  out = out.replace(/([\w-]+)=(&quot;|")([^"]*)(\2)/g,
    (m,a,q,v)=> '<span class="a">'+a+'</span>=<span class="v">"'+v+'"</span>');
  return out;
}
function hlCss(src){
  let out = esc(src);
  out = out.replace(/\/\*[\s\S]*?\*\//g, m => '<span class="c">'+m+'</span>');
  out = out.replace(/^([^\n{@}][^\n{]*?)(\s*\{)/gm, (m,sel,br)=>{
    if (sel.indexOf('</span>')>-1) return m;
    return '<span class="s">'+sel+'</span>'+br;
  });
  out = out.replace(/(--[\w-]+)\s*:/g, '<span class="var">$1</span>:');
  out = out.replace(/(^|[{;\n]\s*)([a-z-]+)\s*:/g, '$1<span class="p">$2</span>:');
  out = out.replace(/var\((--[\w-]+)\)/g, 'var(<span class="var">$1</span>)');
  return out;
}

/* --- 목차 --- */
const nav = document.getElementById('nav');
let lastGroup = null;
PAGES.forEach((p, i) => {
  if (p.group !== lastGroup){
    lastGroup = p.group;
    const g = document.createElement('div');
    g.className = 'side__group';
    g.textContent = p.group;
    nav.appendChild(g);
  }
  const b = document.createElement('button');
  b.className = 'nav__item';
  b.dataset.i = i;
  b.innerHTML = '<div class="nav__num">' + p.file.replace(/-.*/,'').toUpperCase() + '</div>' +
                '<div class="nav__name">' + p.title + '</div>';
  b.onclick = () => select(i);
  nav.appendChild(b);
});

/* --- 선택 --- */
let current = 0;
function select(i){
  current = i;
  const p = PAGES[i];
  document.querySelectorAll('.nav__item').forEach(el =>
    el.classList.toggle('nav__item--on', +el.dataset.i === i));

  document.getElementById('tTitle').textContent = p.title;
  document.getElementById('tFile').textContent = 'pages/' + p.file;
  document.getElementById('tDesc').textContent = p.desc;

  // 미리보기는 srcdoc(문서 내장)으로 렌더합니다.
  // 페이지의 <link ../css/eium.css> 를 인라인 <style> 로 바꾸므로
  // pages/ 폴더를 상대경로로 찾지 않고, index.html 을 어디로 옮겨도 화면이 나옵니다.
  document.getElementById('frame').srcdoc = p.html.replace(
    '<link rel="stylesheet" href="../css/eium.css">',
    '<style>' + CSS_ALL + '</style>'
  );
  document.getElementById('openNew').href = 'pages/' + p.file;

  document.getElementById('htmlCode').innerHTML = hlHtml(p.html);
  document.getElementById('cssCode').innerHTML = hlCss(p.css);

  document.getElementById('hHint').textContent =
    '클래스 ' + p.classes.length + '종 사용';
  document.getElementById('cHint').textContent =
    'css/eium.css 규칙 ' + p.ruleCount + '개 · 섹션: ' + p.sections.join(', ');

  const notes = document.getElementById('notes');
  if (!p.inline.length){
    notes.className = 'notes notes--empty';
    notes.innerHTML = '';
  } else {
    notes.className = 'notes';
    notes.innerHTML = '<div class="notes__title">이 화면에 남아 있는 인라인 style (동적 값 — JS로 주입하세요)</div>' +
      p.inline.map(x => '<div class="notes__row">&lt;' + x.tag + ' class="<b>' + esc(x.cls) +
        '</b>" style="' + esc(x.style) + '"&gt;</div>').join('');
  }
  document.querySelector('.pane__body').scrollTop = 0;
}

/* --- 복사 --- */
document.querySelectorAll('[data-copy]').forEach(btn => {
  btn.onclick = () => {
    const p = PAGES[current];
    navigator.clipboard.writeText(btn.dataset.copy === 'html' ? p.html : p.css)
      .then(() => { const t = btn.textContent; btn.textContent = '복사됨'; setTimeout(()=>btn.textContent=t, 1200); })
      .catch(() => alert('브라우저 보안 정책으로 복사에 실패했습니다. 코드를 직접 선택해 주세요.'));
  };
});

/* --- 키보드 ↑↓ --- */
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown'){ e.preventDefault(); select(Math.min(current+1, PAGES.length-1)); }
  if (e.key === 'ArrowUp'){ e.preventDefault(); select(Math.max(current-1, 0)); }
});

select(0);
</script>
